<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>KDD fix15</title>
<style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px/1.7 ui-monospace,Consolas,monospace;padding:14px}
h1{font-size:15px;color:#58a6ff;margin:0 0 8px}#out{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;min-height:140px}</style></head>
<body>
<h1>KDD fix15 — ترقية دالة النسخ (رسالة + أخضر مقاوم لإعادة الرسم)</h1>
<div id="out">جارٍ البدء...</div>
<script>
(function(){
  var OWNER='fahshomi-ui',REPO='KDD',BRANCH='main';
  var TOKEN=(location.href.match(/ghp_[A-Za-z0-9]+/)||[])[0]||localStorage.getItem('kdd_token')||'';
  var out=document.getElementById('out'),buf='';
  function say(s){buf+=s+'\n';out.textContent=buf;}
  function b64d(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
  function b64e(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin);}
  function gh(p,o){o=o||{};return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+p+(o.q?'?'+o.q:''),{
    method:o.method||'GET',
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:o.body});}
  function getJson(p){
    return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()}).then(function(r){
      if(r.status===401){say('   ! توكن مرفوض');
        var t=prompt('الصق توكن GitHub (ghp_...):','');
        if(!t) throw new Error('بدون توكن');
        TOKEN=t.trim(); localStorage.setItem('kdd_token',TOKEN); say('   token: '+TOKEN.slice(0,12)+'...');
        return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()});}
      return r;
    }).then(function(r){ if(!r.ok) throw new Error('GET HTTP '+r.status); return r.json(); });
  }

  var NEWFUNC = `function kddCopyCard(el, num) {
      var t = String(num || '').replace(/[^0-9]/g, '');
      try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t); } else { throw 0; } }
      catch (e) {
        try { var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a); } catch (e2) {}
      }
      var old = document.getElementById('kddCopyToast');
      if (old && old.parentNode) old.parentNode.removeChild(old);
      var tip = document.createElement('div');
      tip.id = 'kddCopyToast';
      tip.textContent = 'تم النسخ ✓';
      tip.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 24px;border-radius:10px;font-weight:bold;font-size:15px;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.25);';
      document.body.appendChild(tip);
      setTimeout(function () { if (tip.parentNode) tip.parentNode.removeChild(tip); }, 1000);
      var until = Date.now() + 1000;
      var iv = setInterval(function () {
        var done = Date.now() > until;
        var spans = document.querySelectorAll('span[onclick^="kddCopyCard"]');
        for (var i = 0; i < spans.length; i++) {
          var sp = spans[i];
          if (String(sp.getAttribute('onclick') || '').indexOf(t) === -1) continue;
          if (done) { var orig = sp.getAttribute('data-kddc'); if (orig) sp.style.color = orig; }
          else { if (!sp.getAttribute('data-kddc')) sp.setAttribute('data-kddc', sp.style.color || '#333'); sp.style.color = '#16a34a'; }
        }
        if (done) clearInterval(iv);
      }, 40);
    }`;

  function fixAdmin(src){
    var s=src, notes=[];
    var i=s.indexOf('function kddCopyCard(el, num) {');
    if(i>-1){
      var j=s.indexOf('\n    }', i);
      if(j===-1) return {src:src,changed:false,note:'ما لقيت نهاية الدالة'};
      s=s.slice(0,i)+NEWFUNC+s.slice(j+6);
      notes.push('ترقية دالة النسخ');
    } else {
      var k=s.indexOf('    // Notification');
      if(k===-1) k=s.indexOf('    function showNotification(message) {');
      if(k===-1) return {src:src,changed:false,note:'ما لقيت مكان الإدراج'};
      s=s.slice(0,k)+'    // KDD: نسخ رقم البطاقة عند النقر\n    '+NEWFUNC+'\n\n'+s.slice(k);
      notes.push('إضافة دالة النسخ');
    }
    return {src:s,changed:true,note:notes.join(' + ')};
  }

  function patch(p,msg){
    say('— '+p);
    return getJson(p).then(function(j){
      var res=fixAdmin(b64d(j.content));
      if(!res.changed){say('   = لا تغيير ('+res.note+')');return;}
      say('   ✓ '+res.note);
      return gh(p,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(res.src),sha:j.sha,branch:BRANCH})})
        .then(function(r){
          if(r.ok){say('   ✔ تم الحفظ');return;}
          if(r.status===409){say('   ! تعارض — إعادة...');return patch(p,msg);}
          return r.text().then(function(t){throw new Error('PUT HTTP '+r.status+' '+t.slice(0,120));});
        });
    }).catch(function(e){say('   ✗ '+e.message);});
  }

  say('token: '+(TOKEN?TOKEN.slice(0,12)+'...':'(من الذاكرة)'));
  patch('server/admin/index.html','fix(admin): copy toast + resilient green flash')
  .then(function(){return patch('kdd-public/admin.html','fix(admin-static): copy toast + resilient green flash');})
  .then(function(){
    say('\n— التحقق...');
    return getJson('server/admin/index.html').then(function(j){
      var t=b64d(j.content);
      say(t.indexOf('kddCopyToast')>-1?'   ✔ رسالة «تم النسخ» موجودة':'   ✗ ناقصة');
      say(t.indexOf('data-kddc')>-1?'   ✔ الأخضر مقاوم لإعادة الرسم':'   ✗ ناقص');
      say((t.match(/kddCopyCard\(this,/g)||[]).length+' موضع مربوط بالنقر');
    });
  })
  .catch(function(e){say('✗ '+e.message);})
  .then(function(){ say('\n✅ تم — الآن Render: Manual Deploy ثم Netlify: Trigger deploy'); });
})();
</script>
</body>
</html>
