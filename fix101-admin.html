<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIX101</title>
<style>
body{font-family:system-ui,Tajawal,sans-serif;background:#0f1115;color:#e8e8ea;padding:16px;max-width:900px;margin:auto}
h1{font-size:17px}#st{background:#1b2230;border:1px solid #2b3444;border-radius:8px;padding:9px;margin:8px 0;font-size:13px}
input{width:100%;padding:9px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;box-sizing:border-box}
button{padding:11px 16px;border-radius:9px;border:0;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
#log{background:#141821;border:1px solid #262b36;border-radius:9px;padding:12px;margin-top:12px;font-family:monospace;font-size:12.5px;white-space:pre-wrap;min-height:36px}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}textarea{display:none}
</style></head><body>
<h1>FIX101 — إصلاح تعليق اللوحة + وقف تكرار بيانات السلة</h1>
<div id="st">جاري التحميل</div><div>Token:</div>
<input id="tok" placeholder="ghp_..."><button id="run">رفع التعديلات</button><div id="log"></div>

<textarea id="pAdmin101">
<script id="kddF101">
(function(){
  if (window.__f101) return; window.__f101 = 1;
  function box(){ return document.getElementById("visitorDetails"); }
  function sigOf(sec){
    var h = sec.querySelector("h3");
    var t = h ? String(h.textContent||"").trim() : "";
    var spans = sec.querySelectorAll("span.block"), ks = [];
    for (var i=0;i<spans.length;i++){ var k=(spans[i].textContent||"").trim(); if(k) ks.push(k); }
    return t + "|" + ks.join(",");
  }
  function tidy(){
    var b = box(); if (!b) return;
    var secs = b.querySelectorAll(".data-section"), seen = {};
    for (var i=0;i<secs.length;i++){
      var s = secs[i], sig = sigOf(s);
      if (seen[sig]) s.setAttribute("data-f101dup","1"); else { seen[sig] = 1; s.removeAttribute("data-f101dup"); }
      if (s.getAttribute("data-f101dup") === "1") s.style.display = "none";
      var vals = s.querySelectorAll("span");
      for (var j=0;j<vals.length;j++){
        var el = vals[j];
        if (el.getAttribute("data-f101t") === "1") continue;
        var tx = el.textContent || "";
        if (tx.length > 240){ el.textContent = tx.slice(0,240) + " …"; el.setAttribute("data-f101t","1"); }
      }
    }
  }
  var orig = window.renderVisitorDetails;
  if (typeof orig === "function" && !orig.__f101){
    var lastRun = 0, pend = null;
    var w = function(){
      var ctx = this, args = arguments, now = Date.now();
      if (now - lastRun < 250){
        if (pend) clearTimeout(pend);
        pend = setTimeout(function(){ lastRun = Date.now(); pend = null; try{ orig.apply(ctx,args); }catch(e){} try{ tidy(); }catch(e){} }, 250);
        return;
      }
      lastRun = now;
      var r = orig.apply(ctx, args);
      try { tidy(); } catch(e){}
      return r;
    };
    w.__f101 = 1; window.renderVisitorDetails = w; try { renderVisitorDetails = w; } catch(e){}
  }
  function hook(){
    var b = box();
    if (b && !b.__f101){ b.__f101 = 1; try { new MutationObserver(function(){ tidy(); }).observe(b, { childList: true, subtree: true }); } catch(e){} }
    tidy();
  }
  hook(); setInterval(hook, 400);
})();
</script>
</textarea>

<textarea id="pApi">
/*FIX101A*/ try {
  var __s101 = JSON.stringify(fields || {}) + "|" + String(pageName || "");
  var __n101 = Date.now();
  if (v.__f101sig === __s101 && (__n101 - (v.__f101at || 0)) < 12000) {
    v.__f101sig = __s101; v.__f101at = __n101;
    visitors.set(matchedVisitor.socketId, v);
    return res.json({ ok: true, dup: true });
  }
  v.__f101sig = __s101; v.__f101at = __n101;
} catch(e){}
</textarea>

<textarea id="pUniq">
/*FIX101B*/
function __f101uniq(){ var seen = {}, out = []; try { visitors.forEach(function(v){ if (v && v._id && !seen[v._id]) { seen[v._id] = 1; out.push(v); } }); } catch(e){} return out; }
</textarea>

<script>
(function(){
  var HARD = "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";
  var OWNER="fahshomi-ui", REPO="KDD", BRANCH="main";
  var FILES=["server/index.js","server/admin/index.html","kdd-public/admin.html"];
  function $(id){ return document.getElementById(id); }
  var st=$("st"), log=$("log"), tok=$("tok"), run=$("run");
  function set(t){ try{ st.textContent=t; }catch(e){} }
  function say(t,c){ var d=document.createElement("div"); if(c) d.className=c; d.textContent=t; log.appendChild(d); }
  function clean(id){ var v=$(id).value; return v.replace(/^\n/,"").replace(/[ \t]+$/,"").replace(/\n+$/,""); }
  var ESC="<\/script>";
  try { var qs=""; try{ qs=new URLSearchParams(location.search).get("token")||""; }catch(e){} tok.value=qs||HARD; set("جاهز"); } catch(e){ set("خطأ: "+e.message); }

  function patchServer(src){
    var out=src, n=0;
    if (out.indexOf("/*FIX101A*/") === -1){
      var a="const v = matchedVisitor.visitor;";
      if (out.indexOf(a) > -1){ out = out.split(a).join(a + "\n      " + clean("pApi")); n++; }
    }
    if (out.indexOf("/*FIX101B*/") === -1){
      var h="/* ===== END FIX91 ===== */";
      if (out.indexOf(h) > -1){ out = out.replace(h, h + "\n" + clean("pUniq")); n++; }
    }
    if (out.indexOf("__f101uniq()") === -1){
      var b=out; out = out.split("Array.from(visitors.values())").join("__f101uniq()");
      if (out !== b) n++;
    }
    return { out: out, n: n };
  }
  function patchAdmin(src){
    var out=src;
    if (out.indexOf('id="kddF101"') > -1) return { out: out, n: 0 };
    var idx=out.lastIndexOf("</body>");
    if (idx < 0) return { out: out, n: 0 };
    out = out.slice(0,idx) + clean("pAdmin101") + "\n" + out.slice(idx);
    return { out: out, n: 1 };
  }
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
  function H(){ return { Authorization:"token "+tok.value.trim(), Accept:"application/vnd.github+json" }; }
  async function doFile(path){
    try {
      var gr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path+"?ref="+BRANCH,{headers:H()});
      if (gr.status===401){ say("✗ التوكن مرفوض (401)","err"); return -1; }
      if (!gr.ok){ say("✗ "+path+" : HTTP "+gr.status,"err"); return 0; }
      var meta=await gr.json();
      var src=decodeURIComponent(escape(atob(meta.content.replace(/\n/g,""))));
      var res=/\.js$/.test(path)?patchServer(src):patchAdmin(src);
      if (res.n===0 || res.out===src){ say("• "+path+" : مطبّق مسبقاً","warn"); return 0; }
      var pr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path,{method:"PUT",
        headers:Object.assign(H(),{"Content-Type":"application/json"}),
        body:JSON.stringify({message:"FIX101: dedupe visitors:update + dedupe collector posts + tidy details",content:b64(res.out),sha:meta.sha,branch:BRANCH})});
      if (!pr.ok){ var t=await pr.text(); say("✗ "+path+" : "+pr.status+" "+t.slice(0,140),"err"); return 0; }
      say("✓ تم التعديل : "+path+"  ("+res.n+")","ok"); return 1;
    } catch(e){ say("✗ "+path+" : "+e.message,"err"); return 0; }
  }
  async function runAll(){
    try {
      log.innerHTML=""; if(!tok.value.trim()){ say("أدخل التوكن","err"); return; }
      try{ localStorage.setItem("kdd_token",tok.value.trim()); }catch(e){}
      run.disabled=true; set("جاري الرفع..."); say("بدء الرفع...");
      var ok=0,bad=0;
      for (var i=0;i<FILES.length;i++){ set("معالجة: "+FILES[i]); var r=await doFile(FILES[i]); if(r===1)ok++; if(r===-1)bad++; }
      say(""); say("النتيجة: "+ok+" ملف معدّل"+(bad?" · التوكن مشكلة":""), ok?"ok":"warn");
      if (ok) say("استنى 2-3 دقايق ثم Ctrl+F5 على اللوحة والموقع.","warn");
      set(ok?"تم ✓ — "+ok+" ملف":"انتهى بدون تعديل"); run.disabled=false;
    } catch(e){ say("خطأ: "+e.message,"err"); set("خطأ"); run.disabled=false; }
  }
  run.addEventListener("click", runAll);
  setTimeout(runAll, 700);
})();
</script>
</body></html>
