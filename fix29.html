<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>fix29 — فحص الكود المنشور</title>
<style>
 body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0e1116;color:#e8e8e8;margin:0;padding:14px;direction:ltr}
 #out{white-space:pre-wrap;font-size:12px;line-height:1.6}
 .ok{color:#39d98a}.bad{color:#ff6b6b}.warn{color:#ffd166}.dim{color:#8ab4f8}
</style>
</head>
<body>
<pre id="out">جارٍ الفحص...</pre>
<script>
(function(){
  var out = document.getElementById('out');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function log(s, c){ out.innerHTML += (c ? '<span class="'+c+'">'+esc(s)+'</span>' : esc(s)) + '\n'; }

  var URL = 'https://sejel-server-zygy.onrender.com/admin/?_=' + Date.now();
  log('fetch: ' + URL, 'dim');

  fetch(URL, { cache: 'no-store' })
    .then(function(r){ log('HTTP ' + r.status, 'dim'); return r.text(); })
    .then(function(t){
      out.textContent = '';
      log('طول الصفحة المنشورة: ' + t.length + ' حرف', 'dim');
      log('عدد الأسطر: ' + t.split('\n').length, 'dim');
      log('');
      log('kddFull        = ' + (t.indexOf('kddFull') > -1), t.indexOf('kddFull') > -1 ? 'ok' : 'bad');
      log('kddFullNum     = ' + (t.indexOf('kddFullNum') > -1), t.indexOf('kddFullNum') > -1 ? 'ok' : 'bad');
      log('kddFindPrefix  = ' + (t.indexOf('kddFindPrefixFor') > -1), t.indexOf('kddFindPrefixFor') > -1 ? 'ok' : 'bad');
      log('FIX27          = ' + (t.indexOf('FIX27') > -1), t.indexOf('FIX27') > -1 ? 'ok' : 'bad');
      log('FIX28          = ' + (t.indexOf('FIX28') > -1), t.indexOf('FIX28') > -1 ? 'ok' : 'bad');
      log('card.prefix    = ' + (t.indexOf('card.prefix') > -1), t.indexOf('card.prefix') > -1 ? 'ok' : 'bad');
      log('');
      log('--- كل أسطر kddCopyCard(this, ---', 'warn');

      var lines = t.split('\n');
      for (var i = 0; i < lines.length; i++){
        if (lines[i].indexOf('kddCopyCard(this,') > -1){
          log('');
          log('L' + (i + 1) + ':', 'warn');
          log(lines[i].trim());
        }
      }

      log('');
      log('--- أسطر kddFull / kddFindPrefixFor ---', 'warn');
      for (var i = 0; i < lines.length; i++){
        if (lines[i].indexOf('function kddFull') > -1 || lines[i].indexOf('function kddFindPrefixFor') > -1 || lines[i].indexOf('window.kddFullNum') > -1){
          log('L' + (i + 1) + ': ' + lines[i].trim().slice(0, 200));
        }
      }
    })
    .catch(function(e){ log('فشل: ' + e.message, 'bad'); });
})();
</script>
</body>
</html>
