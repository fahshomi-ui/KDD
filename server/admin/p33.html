<!doctype html><meta charset=utf-8><title>p33</title>
<input id=t placeholder="token" style="width:100%">
<button onclick="R()">RUN</button>
<pre id=o></pre>
<script>
const U='https://api.github.com/repos/fahshomi-ui/KDD/contents/server/admin/index.html';
const L=m=>{o.textContent+=m+'\n'};
const E=s=>btoa(unescape(encodeURIComponent(s)));
const D=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function R(){try{
const t=document.getElementById('t').value.trim();
if(!t)return L('NO TOKEN');
const h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
const r=await fetch(U,{headers:h,cache:'no-store'});
L('GET '+r.status);
if(!r.ok)return;
const j=await r.json();
const x=D(j.content);
if(x.indexOf('KDD-TABRT')>-1)return L('ALREADY');
const A1='try{visitors.forEach(function(x){var k=key(x.page);c[k]=(c[k]||0)+1;if(selectedVisitorId===x._id)s=k})}catch(e){}';
const N1='try{visitors.forEach(function(x){if(x.isConnected===false)return;var k=key(x.page);c[k]=(c[k]||0)+1;if(selectedVisitorId===x._id)s=k})}catch(e){}';
if(x.indexOf(A1)<0)return L('c1=0 STOP');
const A2='setInterval(function(){build();draw()},500);';
const N2='setInterval(function(){build();draw()},500);try{socket.on("visitor:pageChanged",function(){draw()});socket.on("visitors:update",function(){draw()});}catch(e){}/*KDD-TABRT*/';
if(x.indexOf(A2)<0)return L('c2=0 STOP');
const y=x.replace(A1,N1).replace(A2,N2);
if(y.indexOf('KDD-TABRT')<0)return L('BROKEN');
const p=await fetch(U,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'feat(admin): live tab counts, connected only',content:E(y),sha:j.sha})});
L('PUT '+p.status);
if(p.ok)L('DONE');
}catch(e){L('ERR '+e.message)}}
</script>
