<!doctype html><meta charset=utf-8><title>p28</title>
<input id=t placeholder="token" style="width:100%">
<button onclick="R()">RUN</button>
<pre id=o></pre>
<script>
const U='https://api.github.com/repos/fahshomi-ui/KDD/contents/server/admin/index.html';
const L=m=>{o.textContent+=m+'\n'};
const E=s=>btoa(unescape(encodeURIComponent(s)));
const D=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function R(){try{
const t=document.getElementById('t').value.trim();
if(!t)return L('NO TOKEN');
const h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
const r=await fetch(U,{headers:h,cache:'no-store'});
L('GET '+r.status);
if(!r.ok)return;
const j=await r.json();
const x=D(j.content);
if(x.indexOf('kddMdown')>-1)return L('ALREADY');
if(x.indexOf('</body>')<0)return L('c1=0 STOP');
const S='<script id=kddMdown>(function(){if(window.__kdm)return;window.__kdm=1;document.addEventListener("mousedown",function(e){var t=e.target;if(!t||!t.closest)return;var c=t.closest("#visitorsList [data-vid]");if(!c)return;if(t.closest("button,input,a"))return;var id=c.getAttribute("data-vid");if(id&&window.selectVisitor)window.selectVisitor(id);},true);})();<\/script>\n</body>';
const y=x.replace('</body>',S);
if(y.indexOf('kddMdown')<0)return L('BROKEN');
const p=await fetch(U,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'fix(admin): select visitor on mousedown',content:E(y),sha:j.sha})});
L('PUT '+p.status);
if(p.ok)L('DONE');
}catch(e){L('ERR '+e.message)}}
</script>
