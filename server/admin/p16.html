<!doctype html><meta charset=utf-8><title>p16</title>
<h3>p16 — رجوع المتصفح يحدّث بطاقة الزائر</h3>
<input id=tok placeholder="github_pat_..." style="width:100%;padding:8px">
<br><br>
<button onclick="run()">RUN</button>
<pre id=log style="white-space:pre-wrap"></pre>
<script>
const OWNER='fahshomi-ui',REPO='KDD',PATH='client/src/kdd/lib/socketClient.ts';
const el=id=>document.getElementById(id);
const log=m=>{el('log').textContent=el('log').textContent.concat(m,'\n');};
function enc(s){const u=new TextEncoder().encode(s);let o='';for(let i=0;i<u.length;i  ){o=o.concat(String.fromCharCode(u[i]));}return btoa(o);}
function dec(s){const b=atob(s.replace(/\n/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i  ){u[i]=b.charCodeAt(i);}return new TextDecoder().decode(u);}
async function run(){
const t=el('tok').value.trim();
if(!t){log('NO TOKEN');return;}
log('GET');
const url='https://api.github.com/repos/'.concat(OWNER,'/',REPO,'/contents/',PATH);
const r=await fetch(url,{headers:{Authorization:'Bearer '.concat(t),Accept:'application/vnd.github json'},cache:'no-store'});
if(!r.ok){log('GET '.concat(String(r.status)));return;}
const j=await r.json();
const txt=dec(j.content);
if(txt.indexOf('KDD-BACK')>-1){log('ALREADY APPLIED');return;}
const A='    h.replaceState = (...args: any[]) => { const r = replace(...args); fire(); return r; };';
if(txt.indexOf(A)===-1){log('c1=0 STOP: anchor missing');return;}
log('c1=1');
const INS='\n    /* KDD-BACK */\n    window.addEventListener("popstate", () => {\n      if (!socket) return;\n      if (!socket.connected) return;\n      try { socket.emit("visitor:pageEnter", pageLabel()); } catch (e) {}\n    });';
const out=txt.replace(A,A.concat(INS));
if(out.indexOf('KDD-BACK')===-1){log('BROKEN: no marker');return;}
if((out.length-txt.length)!==INS.length){log('BROKEN: length');return;}
log('size '.concat(String(out.length)));
const p=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '.concat(t),Accept:'application/vnd.github json','Content-Type':'application/json'},body:JSON.stringify({message:'fix(store): pageEnter on browser Back',content:enc(out),sha:j.sha})});
log('PUT '.concat(String(p.status)));
if(p.ok){log('DONE');}else{log(await p.text());}
}
</script>
