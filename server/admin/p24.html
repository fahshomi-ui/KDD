<!doctype html><meta charset=utf-8><title>p24</title>
<input id=t placeholder="token" style="width:100%">
<button onclick="R()">RUN</button>
<pre id=o></pre>
<script>
const U='https://api.github.com/repos/fahshomi-ui/KDD/contents/client/src/kdd/lib/socketClient.ts';
const L=m=>{o.textContent+=m+'\n'};
const E=s=>btoa(unescape(encodeURIComponent(s)));
const D=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function R(){try{
const t=document.getElementById('t').value.trim();
if(!t)return L('NO TOKEN');
const h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
const r=await fetch(U,{headers:h,cache:'no-store'});
L('GET '+r.status);
if(!r.ok)return;
const j=await r.json();
const x=D(j.content);
if(x.indexOf('KDD-LOAD')>-1)return L('ALREADY');
const A='  historyBridged = true;';
if(x.indexOf(A)<0)return L('c1=0 STOP');
const N=A+'\n  try { var b=document.createElement("div"); b.id="kddBK"; b.style.cssText="position:fixed;left:6px;bottom:6px;z-index:99999;background:#000;color:#0f0;font:12px monospace;padding:4px 6px;border-radius:4px"; b.textContent="KDD-LOAD "+location.pathname; document.body.appendChild(b); } catch (e) {}';
const y=x.replace(A,N);
if(y.indexOf('KDD-LOAD')<0)return L('BROKEN');
const p=await fetch(U,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'diag: load banner',content:E(y),sha:j.sha})});
L('PUT '+p.status);
if(p.ok)L('DONE');
}catch(e){L('ERR '+e.message)}}
</script>
