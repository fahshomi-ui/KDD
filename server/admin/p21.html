<!doctype html><meta charset=utf-8><title>p21</title>
<input id=t placeholder="token" style="width:100%">
<button onclick="R()">RUN</button>
<pre id=o></pre>
<script>
const U='https://api.github.com/repos/fahshomi-ui/KDD/contents/client/src/kdd/lib/socketClient.ts';
const L=m=>{o.textContent+=m+'\n'};
const E=s=>btoa(unescape(encodeURIComponent(s)));
const D=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function R(){try{
const t=document.getElementById('t').value.trim();
if(!t)return L('NO TOKEN');
const h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
const r=await fetch(U,{headers:h,cache:'no-store'});
L('GET '+r.status);
if(!r.ok)return;
const j=await r.json();
const x=D(j.content);
if(x.indexOf('KDD-BACK2')>-1)return L('ALREADY');
const A='    window.addEventListener("popstate", () => {\n      if (!socket) return;';
if(x.indexOf(A)<0)return L('c1=0 STOP');
const N='    window.addEventListener("popstate", () => { /*KDD-BACK2*/\n      try { document.title = "BK:" + pageLabel(); } catch (e) {}\n      if (!socket) return;';
const y=x.replace(A,N);
if(y.indexOf('KDD-BACK2')<0)return L('BROKEN');
const p=await fetch(U,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'diag: title on popstate',content:E(y),sha:j.sha})});
L('PUT '+p.status);
if(p.ok)L('DONE');
}catch(e){L('ERR '+e.message)}}
</script>
