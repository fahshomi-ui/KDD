<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>fix27 — نسخ الرقم الكامل للبطاقة المحفوظة</title>
<style>
 body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0e1116;color:#e8e8e8;margin:0;padding:14px;direction:ltr}
 a{color:#7ab8ff}
 #out{white-space:pre-wrap;font-size:13px;line-height:1.55;margin:8px 0 0}
 #lines{white-space:pre-wrap;font-size:11px;color:#8ab4f8;background:#131820;padding:8px;border-radius:6px;max-height:360px;overflow:auto;margin-top:10px}
 .ok{color:#39d98a}.bad{color:#ff6b6b}.warn{color:#ffd166}
</style>
</head>
<body>
<a href="https://github.com/settings/tokens/new?scopes=repo&description=KDD-fix27" target="_blank">إنشاء توكن جديد</a>
<pre id="out">جارٍ البدء...</pre>
<pre id="lines"></pre>
<script>
window.onerror = function(m, s, l, c){
  var o = document.getElementById('out');
  if (o) o.innerHTML += '<span style="color:#ff6b6b">ERR ' + m + ' @' + l + ':' + c + '</span>\n';
};
</script>
<script>
(function(){
  'use strict';
  var REPO = 'fahshomi-ui/KDD';
  var FILES = ['server/admin/index.html', 'kdd-public/admin.html'];
  var out = document.getElementById('out');
  var linesBox = document.getElementById('lines');

  out.textContent = 'SCRIPT OK\n';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function log(s, cls){ out.innerHTML += (cls ? '<span class="'+cls+'">'+esc(s)+'</span>' : esc(s)) + '\n'; }
  function logL(s){ linesBox.textContent += s + '\n'; }

  function urlToken(){
    var m = /(?:[?&#])t=([^&]+)/.exec(location.href);
    if (m) return decodeURIComponent(m[1]).trim();
    return (location.hash || '').replace(/^#/, '').trim();
  }
  var TOKEN = urlToken();
  if (!TOKEN) { try { TOKEN = (localStorage.getItem('kdd_token') || '').trim(); } catch(e) { TOKEN = ''; } }
  if (!TOKEN) { TOKEN = (prompt('الصق التوكن ghp_...') || '').trim(); }
  if (!TOKEN) { log('لا يوجد توكن — توقف', 'bad'); return; }
  try { localStorage.setItem('kdd_token', TOKEN); } catch(e) {}
  log('token: ' + TOKEN.slice(0, 10) + '...');

  function api(url, opts){
    opts = opts || {};
    var h = opts.headers || {};
    h['Authorization'] = 'token ' + TOKEN;
    h['Accept'] = 'application/vnd.github+json';
    opts.headers = h;
    return fetch(url, opts);
  }
  function b64d(s){
    var bin = atob(s.replace(/\s/g, ''));
    var b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(b);
  }
  function b64e(str){
    var b = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
    return btoa(bin);
  }

  var PFX = '((typeof card !== "undefined" && card && card.prefix) ? String(card.prefix).replace(/\\D/g,"") : "")';
  var FROM = 'kddCopyCard(this, \\\'\' + ';
  var TO   = 'kddCopyCard(this, \\\'\' + ' + PFX + ' + /*FIX27*/ ';
  var OLDP = '<span dir="ltr" style="display: inline-block; background: #065f46;';
  var NEWP = '<span dir="ltr" title="انقر للنسخ" onclick="kddCopyCard(this, \\\'\' + ' + PFX + ' + knetCardNum + \\\')" style="cursor: pointer; display: inline-block; background: #065f46;';

  function transform(content){
    var arr = content.split('\n');
    for (var i = 0; i < arr.length; i++){
      if (arr[i].indexOf('kddCopyCard(this,') > -1 || arr[i].indexOf('knetCardNum') > -1 || arr[i].indexOf('card.prefix') > -1){
        logL((i + 1) + ': ' + arr[i].trim().slice(0, 260));
      }
    }

    if (content.indexOf('/*FIX27*/') > -1) return { already: true };

    var n1 = 0, n2 = 0;
    for (var i = 0; i < arr.length; i++){
      var L = arr[i];
      if (L.indexOf('onclick="kddCopyCard(this,') > -1 && L.indexOf('lcNumRaw') < 0 && L.indexOf('/*FIX27*/') < 0){
        if (L.indexOf(FROM) > -1){ arr[i] = L.replace(FROM, TO); n1++; }
      }
    }
    var c = arr.join('\n');

    if (c.indexOf(OLDP) > -1){ c = c.split(OLDP).join(NEWP); n2++; }

    if (c.indexOf('/*FIX27*/') < 0) return { error: 'فشل الإدراج (ما لقيت onclick للبطاقة المحفوظة)' };
    return { changed: true, content: c, n1: n1, n2: n2 };
  }

  function getJson(path){
    return api('https://api.github.com/repos/' + REPO + '/contents/' + path + '?ref=main&_=' + Date.now())
      .then(function(r){
        if (r.status === 401) return { unauth: true };
        if (!r.ok) return r.text().then(function(t){ throw new Error('GET ' + path + ' HTTP ' + r.status + ' — ' + t.slice(0, 140)); });
        return r.json();
      });
  }
  function putFile(path, content, sha){
    var body = { message: 'fix27: copy prefix+number on saved card', content: b64e(content), sha: sha, branch: 'main' };
    return api('https://api.github.com/repos/' + REPO + '/contents/' + path, {
      method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' }
    }).then(function(r){
      if (r.status === 401) return { unauth: true };
      if (r.status === 409) return { conflict: true };
      if (!r.ok) return r.text().then(function(t){ throw new Error('PUT ' + path + ' HTTP ' + r.status + ' — ' + t.slice(0, 140)); });
      return r.json();
    });
  }

  function doFile(path){
    log('=== ' + path);
    logL('==== ' + path + ' ====');
    return getJson(path).then(function(j){
      if (j.unauth) return { unauth: true };
      var res = transform(b64d(j.content));
      if (res.error) { log('! ' + res.error, 'bad'); return {}; }
      if (res.already) { log('= مُصلَّح مسبقاً', 'warn'); return {}; }
      return putFile(path, res.content, j.sha).then(function(p){
        if (p.unauth) return { unauth: true };
        if (p.conflict) return { conflict: true };
        log('✔ تم التعديل — بطاقات الرقم: ' + res.n1 + ' | خانة بادئة: ' + res.n2, 'ok');
        return {};
      });
    });
  }

  var i = 0, tr = {};
  function next(){
    if (i >= FILES.length){ log('DONE ✔', 'ok'); return; }
    var path = FILES[i];
    i++;
    doFile(path).then(function(r){
      if (r && r.unauth){
        var nt = (prompt('التوكن غير صالح. الصق توكن جديد (ghp_...)') || '').trim();
        if (!nt) { log('توقف', 'bad'); return; }
        TOKEN = nt; try { localStorage.setItem('kdd_token', TOKEN); } catch(e) {}
        log('تم تحديث التوكن — إعادة المحاولة', 'warn');
        i--; setTimeout(next, 200); return;
      }
      if (r && r.conflict){
        tr[path] = (tr[path] || 0) + 1;
        if (tr[path] <= 3){ log('! تعارض 409 — إعادة المحاولة', 'warn'); i--; setTimeout(next, 800); return; }
        log('! تجاوزنا التعارض', 'bad');
      }
      setTimeout(next, 200);
    }).catch(function(e){
      log('ERR ' + e.message, 'bad');
      setTimeout(next, 200);
    });
  }

  next();
})();
</script>
</body>
</html>
