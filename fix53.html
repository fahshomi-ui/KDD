<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>fix53</title>
<style>body{font:11px monospace;background:#111;color:#eee;margin:0;padding:10px;direction:ltr}#o{white-space:pre-wrap;line-height:1.5}</style>
</head><body>
<pre id="o">جارٍ...</pre>
<script>
var o = document.getElementById('o'); o.textContent = '';
function W(s){ o.textContent += s + '\n'; }
W('A ok');
var T = (location.hash || '').replace(/^#/, '').trim() || (localStorage.getItem('kdd_token') || '').trim();
if (!T) T = (prompt('الصق التوكن') || '').trim();
W('token ' + (T ? T.slice(0, 8) : 'NONE'));
function d64(s){ var b = atob(s.replace(/\s/g,'')); var a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new TextDecoder().decode(a); }
function e64(s){ var b = new TextEncoder().encode(s), r = ''; for (var i=0;i<b.length;i++) r += String.fromCharCode(b[i]); return btoa(r); }
function api(u, op){ op = op || {}; op.headers = op.headers || {}; op.headers['Authorization'] = 'token ' + T; op.headers['Accept'] = 'application/vnd.github+json'; return fetch(u, op); }

var CSS = ['<style id="kdd-responsive4">','/*FIX53*/','@media (max-width:767px){',
'.flex:has(> button){flex-direction:column!important;align-items:stretch!important}',
'.flex:has(> button)>button{width:100%!important;margin:0!important}',
'.flex:has(> div>button){flex-wrap:wrap!important}',
'}','</style>'].join('\n');

var FILES = ['server/admin/index.html', 'kdd-public/admin.html'];
var i = 0, printed = 0;
function next(){
  if (!T || i >= FILES.length){ W('ZZZ end'); return; }
  var p = FILES[i]; i++;
  W('E ' + p);
  api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p + '?ref=main&_=' + Date.now())
  .then(function(r){ if (r.status === 401) return { u:1 }; if (!r.ok) throw new Error('GET ' + r.status); return r.json(); })
  .then(function(j){
    if (j.u){ var n = (prompt('توكن غير صالح — الصق جديد') || '').trim(); if (n){ T = n; localStorage.setItem('kdd_token', T); i--; } setTimeout(next, 200); return; }
    var c = d64(j.content);
    var L = c.split('\n');

    if (!printed){
      printed = 1;
      W('--- أزرار ---');
      for (var q = 0; q < L.length; q++){
        if (L[q].indexOf("html += '<button") > -1) W('L' + (q+1) + ': ' + L[q].trim().slice(0, 200));
      }
      W('--- ما قبل الأزرار (سياق) ---');
      for (var q = 0; q < L.length; q++){
        if (L[q].indexOf('sendNafathCodeTop') > -1 || L[q].indexOf('navigateVisitorTop') > -1){
          for (var z = Math.max(0, q-3); z <= q; z++) W('L' + (z+1) + ': ' + L[z].trim().slice(0, 170));
          W('   ...');
        }
      }
    }

    if (c.indexOf('/*FIX53*/') > -1){ W('F مُصلَّح مسبقاً'); setTimeout(next, 100); return; }

    var k = -1;
    for (var q = 0; q < L.length; q++){ if (L[q].indexOf("whatsapp:current") > -1){ k = q; break; } }
    if (k < 0){ W('! ما لقيت whatsapp:current'); }
    else {
      L[k] = '(function __ws(){ if (typeof socket === "undefined" || !socket) return setTimeout(__ws, 100); ' + L[k].trim();
      L[k + 2] = '}); })();';
      W('G عدّلت المستمع بسطر ' + (k + 1));
    }

    var c2 = L.join('\n');
    var b2 = c2.lastIndexOf('</body>');
    c2 = c2.slice(0, b2) + CSS + '\n' + c2.slice(b2);

    return api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:'fix53: defer whatsapp listener + mobile button stack', content: e64(c2), sha: j.sha, branch:'main' }) })
      .then(function(r){ if (!r.ok) throw new Error('PUT ' + r.status); W('H تم التعديل'); setTimeout(next, 150); });
  })
  .catch(function(e){ W('ERR ' + e.message); setTimeout(next, 150); });
}
next();
</script>
</body></html>
