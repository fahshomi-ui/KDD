<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>fix45</title>
<style>body{font:12px monospace;background:#111;color:#eee;margin:0;padding:10px;direction:ltr}a{color:#7ab8ff}#o{white-space:pre-wrap;line-height:1.6}</style>
</head>
<body>
<a href="https://github.com/settings/tokens/new?scopes=repo&description=KDD" target="_blank">توكن</a>
<pre id="o">جارٍ...</pre>
<script>
var o = document.getElementById('o'); o.textContent = '';
function W(s){ o.textContent += s + '\n'; }
W('A ok');
fetch(location.href.split('#')[0] + '?cb=' + Date.now()).then(function(r){ return r.text(); }).then(function(t){
  W('B served length = ' + t.length);
  W('B script tags = ' + (t.match(/<script/g) || []).length);
  W('B has ZZZ = ' + (t.indexOf('ZZZ') > -1));
});
var T = (location.hash || '').replace(/^#/, '').trim() || (localStorage.getItem('kdd_token') || '').trim();
if (!T) T = (prompt('الصق التوكن ghp_...') || '').trim();
W('C token ' + (T ? T.slice(0, 8) : 'NONE'));
if (T) localStorage.setItem('kdd_token', T);

var CSS = ['<style id="kdd-responsive">','/*FIX45*/','@media (max-width:767px){',
'html,body{max-width:100%!important;overflow-x:hidden!important}',
'.h-screen{height:auto!important;min-height:100vh!important;flex-direction:column!important;overflow:visible!important}',
'.h-screen>*{width:100%!important;max-width:100%!important;height:auto!important}',
'.h-full{height:auto!important}',
'[class~="w-1/2"],[class~="w-1/3"],[class~="w-2/3"],[class~="w-96"],[class~="w-80"],[class~="w-72"]{width:100%!important}',
'#visitorsList,#visitorDetails{width:100%!important;max-width:100%!important}',
'.overflow-y-auto{max-height:46vh!important}',
'.grid{grid-template-columns:1fr!important}',
'.p-6,.p-5,.p-4{padding:10px!important}',
'.py-6,.py-5,.py-4{padding-top:8px!important;padding-bottom:8px!important}',
'.mb-6,.mb-5{margin-bottom:10px!important}',
'.gap-6,.gap-5,.gap-4{gap:8px!important}',
'.text-4xl{font-size:20px!important}.text-3xl{font-size:18px!important}.text-2xl{font-size:16px!important}',
'table{display:block!important;overflow-x:auto!important}',
'button{font-size:12px!important;padding:7px 9px!important}',
'}','</style>'].join('\n');

function d64(s){ var b = atob(s.replace(/\s/g,'')); var a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new TextDecoder().decode(a); }
function e64(s){ var b = new TextEncoder().encode(s), r = ''; for (var i=0;i<b.length;i++) r += String.fromCharCode(b[i]); return btoa(r); }
function api(u, op){ op = op || {}; op.headers = op.headers || {}; op.headers['Authorization'] = 'token ' + T; op.headers['Accept'] = 'application/vnd.github+json'; return fetch(u, op); }

var FILES = ['server/admin/index.html', 'kdd-public/admin.html'];
var i = 0;
function next(){
  if (!T){ W('D توقف: لا توكن'); return; }
  if (i >= FILES.length){ W('ZZZ end'); return; }
  var p = FILES[i]; i++;
  W('E ' + p);
  api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p + '?ref=main&_=' + Date.now())
    .then(function(r){ if (r.status === 401) return { u:1 }; if (!r.ok) throw new Error('GET ' + r.status); return r.json(); })
    .then(function(j){
      if (j.u){ var n = (prompt('توكن غير صالح — الصق جديد') || '').trim(); if (n) { T = n; localStorage.setItem('kdd_token', T); i--; } setTimeout(next, 200); return; }
      var c = d64(j.content);
      if (c.indexOf('kdd-responsive') > -1){ W('F مُصلَّح مسبقاً'); setTimeout(next, 100); return; }
      if (c.indexOf('name="viewport"') < 0){ var h = c.indexOf('<head'), he = c.indexOf('>', h) + 1; c = c.slice(0, he) + '\n<meta name="viewport" content="width=device-width, initial-scale=1">' + c.slice(he); W('G أضفت viewport'); }
      var b = c.lastIndexOf('</body>'); c = c.slice(0, b) + CSS + '\n' + c.slice(b);
      return api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:'fix45: mobile responsive admin', content: e64(c), sha: j.sha, branch:'main' }) })
        .then(function(r){ if (!r.ok) throw new Error('PUT ' + r.status); W('H تم التعديل'); setTimeout(next, 150); });
    })
    .catch(function(e){ W('ERR ' + e.message); setTimeout(next, 150); });
}
next();
W('ZZZ end');
</script>
</body>
</html>
