<!doctype html><meta charset="utf-8"><title>dbg2</title>
<pre id="o" style="font:12px monospace;white-space:pre-wrap;padding:10px"></pre>
<script>
var o=document.getElementById('o'),out=function(m){o.textContent+=m+'\n'},MAP={};
window.onerror=function(msg,src,line,col){var L=MAP[src],syn=/Invalid|Unexpected|Unterminated|Token|end of input/.test(msg);out((syn?'>>>SYNTAX ':'.. ')+msg+' @'+line+':'+col);if(syn&&L){for(var k=Math.max(0,line-6);k<Math.min(L.length,line+2);k++)out('L'+(k+1)+'| '+L[k])}};
fetch('https://raw.githubusercontent.com/fahshomi-ui/KDD/main/server/admin/index.html?x='+Date.now()).then(function(r){return r.text()}).then(function(s){
out('len='+s.length+' lines='+s.split('\n').length);
var re=/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g,m,i=0;
while((m=re.exec(s))){
var lines=m[1].split('\n');out('inline#'+i+' at '+m.index+' lines='+lines.length);
var url=URL.createObjectURL(new Blob([m[1]],{type:'application/javascript'}));MAP[url]=lines;
var el=document.createElement('script');el.src=url;el.onerror=function(){out('#'+i+' PARSE FAIL')};
document.body.appendChild(el);i++;}
out('DONE');
});
</script>
