<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>F138</title>
<style>body{background:#0b1220;color:#e5e7eb;font:13px system-ui;padding:14px;max-width:900px;margin:auto}
button{background:#7c3aed;color:#fff;border:0;border-radius:9px;padding:11px 24px;font-weight:700}
input{width:100%;box-sizing:border-box;background:#020617;border:1px solid #334155;color:#fff;border-radius:8px;padding:9px;font:12px monospace;direction:ltr;margin:8px 0}
#log{background:#020617;border:1px solid #1e293b;border-radius:8px;padding:10px;font:11.5px/1.6 monospace;direction:ltr;white-space:pre-wrap;min-height:140px}</style></head>
<body>
<div style="color:#a78bfa;font-weight:700">F138 — تثبيت الترتيب (تعطيل المُرتِّب القديم)</div>
<input id="tk" type="password" placeholder="GitHub token (اختياري إذا محفوظ)">
<button id="go">تنفيذ</button>
<div id="log">جاهز.</div>
<textarea id="blk" style="display:none">
<script id="kddF138">
(function(){
  if (window.__f138) return; window.__f138 = 1;
  try { if (document.title.indexOf('F138') < 0) document.title += ' ·F138'; } catch(e){}
  function kill(){
    var c = document.getElementById('visitorsList'); if (!c) return;
    if (c.appendChild && c.appendChild.__f138) return;
    var noop = function(){ return null; }; noop.__f138 = 1;
    try { c.appendChild = noop; } catch(e){}
  }
  kill(); setInterval(kill, 500);
  function nudge(){
    try {
      var c = document.getElementById('visitorsList'); if (!c) return;
      var kids = c.children, n = 0;
      for (var i=0;i<kids.length;i++){ if (kids[i].getAttribute && kids[i].getAttribute('data-vid')) n++; }
      if (n > 1) { var t = document.createTextNode(''); c.appendChild(t); c.removeChild(t); }
    } catch(e){}
  }
  setInterval(nudge, 900);
})();
</script>
</textarea>
<script>
var L=document.getElementById('log');
function p(s,c){var d=document.createElement('div');if(c)d.style.color=c;d.textContent=s;L.appendChild(d);}
var R='fahshomi-ui/KDD',P='server/admin/index.html',BR='main';
var RAW='https://raw.githubusercontent.com/'+R+'/'+BR+'/'+P;
var API='https://api.github.com/repos/'+R+'/contents/'+P;
document.getElementById('go').onclick=async function(){
var b=this; b.disabled=1; L.textContent='بدء';
var B=document.getElementById('blk').value.trim();
p('block lines '+B.split('\n').length);
if(B.indexOf('kddF138')<0||B.slice(-9).indexOf('script')<0){p('BLOCK تالف — أعد اللصق','#f87171');b.disabled=0;return;}
var tk=(document.getElementById('tk').value||'').trim()||localStorage.getItem('kdd_tok')||prompt('GitHub token');
if(!tk){p('لا توكن','#f87171');b.disabled=0;return;} localStorage.setItem('kdd_tok',tk);
var r1=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});
if(!r1.ok){p('get '+r1.status,'#f87171');b.disabled=0;return;}
var t=await r1.text(); p('lines '+t.split('\n').length);
if(t.indexOf('id="kddF138"')>-1){p('F138 مطبق مسبقا','#f87171');b.disabled=0;return;}
if(t.indexOf('id="kddF137"')<0){p('F137 غير موجود','#f87171');b.disabled=0;return;}
var o=t.replace(/\s*$/,'')+'\n'+B+'\n';
p('new lines '+o.split('\n').length);
var r2=await fetch(API+'?ref='+BR,{headers:{Authorization:'Bearer '+tk},cache:'no-store'});
if(!r2.ok){p('sha '+r2.status,'#f87171');b.disabled=0;return;}
var m=await r2.json(); p('رفع...');
var r3=await fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({message:'F138 pin order',content:btoa(unescape(encodeURIComponent(o))),sha:m.sha,branch:BR})});
if(!r3.ok){p('put '+r3.status+' '+(await r3.text()).slice(0,200),'#f87171');b.disabled=0;return;}
p('DONE','#34d399');p('Render > Manual Deploy ثم ?v=8','#34d399');b.disabled=0;
};
</script>
</body></html>
