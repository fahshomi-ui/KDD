<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDD - صوت الفقّة v3</title>
<style>
 body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#0f1115;color:#e8eaf0;margin:0;padding:20px}
 .wrap{max-width:820px;margin:0 auto}
 h1{font-size:20px;margin:0 0 4px}
 p.sub{color:#9aa3b2;font-size:13px;margin:0 0 18px}
 .card{background:#171a21;border:1px solid #242a35;border-radius:12px;padding:16px;margin-bottom:14px}
 label{display:block;font-size:13px;color:#9aa3b2;margin-bottom:6px}
 input{width:100%;box-sizing:border-box;background:#0d0f13;border:1px solid #2b3240;color:#e8eaf0;border-radius:9px;padding:11px;font-size:14px;direction:ltr}
 .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
 button{flex:1;min-width:150px;border:0;border-radius:9px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
 .go{background:#2ecc71;color:#06210f}
 .test{background:#2b3240;color:#e8eaf0}
 .alt{background:#1f2a3a;color:#9ecbff}
 button:disabled{opacity:.5;cursor:default}
 #log{background:#0b0d11;border:1px solid #242a35;border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;min-height:140px;direction:ltr;text-align:left;line-height:1.7}
 .ok{color:#2ecc71}.er{color:#ff6b6b}.in{color:#7fb3ff}.wn{color:#ffd166}
</style>
</head>
<body>
<div class="wrap">
  <h1>صوت الفقّة - الملخص + الكي نت/البطاقة + الرمز فقط</h1>
  <p class="sub">اضغط M للكتم. أول دوسة بالصفحة تفعّل الصوت.</p>

  <div class="card">
    <label>GitHub Token (repo scope)</label>
    <input id="tok" placeholder="ghp_..." autocomplete="off">
    <div class="row">
      <button class="go" id="run">تثبيت / تحديث الفلتر</button>
      <button class="test" id="tst">تجربة الصوت</button>
      <button class="alt" id="chk">اختبار الاتصال</button>
    </div>
  </div>

  <div id="log"></div>
</div>
