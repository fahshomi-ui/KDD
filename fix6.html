<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>KDD fix6</title>
<style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px/1.7 ui-monospace,Consolas,monospace;padding:14px}
h1{font-size:15px;color:#58a6ff;margin:0 0 8px}#out{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;min-height:120px}</style></head>
<body>
<h1>KDD fix6 — إصلاح مسار حفظ البيانات (/data)</h1>
<div id="out">جارٍ البدء...</div>
<script>
(function(){
  var OWNER='fahshomi-ui',REPO='KDD',BRANCH='main';
  var BAKED='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';
  var TOKEN=(location.href.match(/ghp_[A-Za-z0-9]+/)||[])[0]||localStorage.getItem('kdd_token')||BAKED;
  var out=document.getElementById('out'),buf='';
  function say(s){buf+=s+'\n';out.textContent=buf;}
  function b64d(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
  function b64e(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin);}
  function gh(p,o){o=o||{};return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+p+(o.q?'?'+o.q:''),{
    method:o.method||'GET',
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:o.body});}
  function getFile(p){return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()}).then(function(r){
    if(r.status===401){say('! توكن غير صالح');var t=prompt('الصق توكن GitHub جديد (ghp_...):','');
      if(!t)throw new Error('بدون توكن');TOKEN=t.trim();localStorage.setItem('kdd_token',TOKEN);
      return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()});}
    if(!r.ok)throw new Error('GET HTTP '+r.status);return r.json();});}

  var NEW=[
   "const DATA_DIR = (function () {",
   "  if (process.env.NODE_ENV !== 'production') return __dirname;",
   "  try {",
   "    fs.mkdirSync('/data', { recursive: true });",
   "    fs.accessSync('/data', fs.constants.W_OK);",
   "    return '/data';",
   "  } catch (e) {",
   "    console.log('DATA_DIR: fallback to ' + __dirname);",
   "    return __dirname;",
   "  }",
   "})();"].join('\n');

  say('token: '+TOKEN.slice(0,12)+'...');
  say('— server/index.js');
  getFile('server/index.js').then(function(j){
    var s=b64d(j.content);
    if(s.indexOf("fs.accessSync('/data'")>-1){say('   = مُصلَّح مسبقاً');return;}
    var lines=s.split('\n'),hit=-1;
    for(var i=0;i<lines.length;i++){ if(lines[i].indexOf('const DATA_DIR')>-1){hit=i;break;} }
    if(hit<0)throw new Error('ما لقيت سطر DATA_DIR');
    var ind=(lines[hit].match(/^\s*/)||[''])[0];
    lines.splice(hit,1,NEW.split('\n').map(function(l){return l?ind+l:l;}).join('\n'));
    say('   ✓ مسار البيانات صار يرجع لمجلد السيرفر إذا /data مو موجود');
    return gh('server/index.js',{method:'PUT',body:JSON.stringify({
      message:'fix(server): DATA_DIR fallback when /data is not writable',
      content:b64e(lines.join('\n')),sha:j.sha,branch:BRANCH})}).then(function(p){
        if(!p.ok)return p.text().then(function(t){throw new Error('PUT HTTP '+p.status+' '+t.slice(0,150));});
        say('   ✔ تم الحفظ');
      });
  }).catch(function(e){say('   ✗ '+e.message);}).then(function(){
    say('\n✅ تم — Render رح يعيد النشر، وبعدها البيانات بتضل محفوظة');
  });
})();
</script>
</body>
</html>
