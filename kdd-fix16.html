<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F133</title>
<style>
body{font-family:system-ui,Tahoma,Arial;background:#f3f4f6;margin:0;padding:16px}
.b{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;padding:18px}
h1{font-size:17px;margin:0 0 8px}
p.n{font-size:12px;color:#555;margin:0 0 10px;line-height:1.7}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;direction:ltr}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:15px}
#log{margin-top:12px;background:#0f172a;color:#4ade80;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;direction:ltr;text-align:left;min-height:160px;font-family:monospace}
</style>
</head>
<body>
<div class="b">
<h1>F133 — البطاقة المباشرة تظهر فارغة وتتعبّى لايف</h1>
<p class="n">سطرين فقط: شرط العرض + حماية بيانات البطاقة. عدد السطور لا يتغير.</p>
<input id="tok" placeholder="ghp_...">
<button id="go">تنفيذ</button>
<pre id="log">HTML_LOADED</pre>
</div>
<script>
window.onerror = function(m,s,l,c){ try{ document.getElementById('log').textContent += 'JS_ERROR ' + m + ' @' + l + ':' + c + '\n'; }catch(e){} };
</script>
<script>
var REPO='fahshomi-ui/KDD', P='server/admin/index.html', tk='';
function log(m){ var d=document.getElementById('log'); if(d) d.textContent += m + '\n'; }
function b64d(s){ var b=atob(String(s).replace(/\s/g,'')); var a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new TextDecoder('utf-8').decode(a); }
function b64e(s){ var a=new TextEncoder().encode(s); var o=''; for(var i=0;i<a.length;i++) o+=String.fromCharCode(a[i]); return btoa(o); }
function req(method,url,body){ return fetch(url,{method:method,headers:{'Authorization':'token '+tk,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(method+' '+r.status+' '+t.slice(0,140)); }); return r.json(); }); }

function patch(src){
  var L = src.split('\n'), iIf = -1, iLc = -1;
  for (var k=0;k<L.length;k++){
    var t = L[k].trim();
    if (iIf < 0 && L[k].indexOf('/*FIX-LIVE*/ if (visitor.liveCard && !__lcOtp && (__lcHas') === 0) iIf = k;
    if (iLc < 0 && t === 'const lc = entry.data;') iLc = k;
  }
  if (iIf < 0) throw new Error('IF_NOT_FOUND');
  if (iLc < 0) throw new Error('LC_NOT_FOUND');
  var b1 = L[iIf], b2 = L[iLc];
  L[iIf] = L[iIf].replace('visitor.liveCard && !__lcOtp &&', '!__lcOtp &&');
  L[iLc] = L[iLc].replace('entry.data;', 'entry.data || {};');
  if (L[iIf] === b1) throw new Error('IF_NO_REPLACE');
  if (L[iLc] === b2) throw new Error('LC_NO_REPLACE');
  return L.join('\n');
}

log('SCRIPT_RUNNING');

try {
  var smp = [
    'a',
    '/*FIX-LIVE*/ if (visitor.liveCard && !__lcOtp && (__lcHas || __lcEntry) && (__lastPcTs === 0 || __lcTs > __lastPcTs)) {',
    "  allEntries.push({ type: 'liveCard' });",
    '}',
    "  if (entry.type === 'liveCard') {",
    '  const lc = entry.data;',
    'Z'
  ].join('\n');
  var rs = patch(smp);
  var okA = rs.split('\n').length === smp.split('\n').length;
  var okB = rs.indexOf('if (!__lcOtp && (__lcHas') > -1;
  var okC = rs.indexOf('const lc = entry.data || {};') > -1;
  var okD = rs.indexOf('visitor.liveCard && !__lcOtp') < 0;
  log('SELFTEST ' + ((okA && okB && okC && okD) ? 'PASS' : ('FAIL a='+okA+' b='+okB+' c='+okC+' d='+okD)));
} catch(e){ log('SELFTEST FAIL ' + e.message); }

try { var st = localStorage.getItem('kdd_tok'); if (st) document.getElementById('tok').value = st; } catch(e){}

document.getElementById('go').onclick = function(){
  var t = document.getElementById('tok').value.trim();
  if (!t){ alert('TOKEN ?'); return; }
  tk = t;
  var btn = document.getElementById('go'); btn.disabled = true;
  log('1 read');
  req('GET','https://api.github.com/repos/'+REPO+'/contents/'+P+'?t='+Date.now()).then(function(info){
    var src = b64d(info.content);
    if (src.indexOf('const lc = entry.data || {};') > -1){ log('already applied'); return; }
    var out = patch(src);
    log('patch ok | lines ' + src.split('\n').length + ' -> ' + out.split('\n').length);
    log('chk1 cond? ' + (out.indexOf('if (!__lcOtp && (__lcHas') > -1 ? 'YES_OK' : 'NO_BAD'));
    log('chk2 lc guard? ' + (out.indexOf('const lc = entry.data || {};') > -1 ? 'YES_OK' : 'NO_BAD'));
    log('chk3 old cond gone? ' + (out.indexOf('visitor.liveCard && !__lcOtp') < 0 ? 'YES_OK' : 'NO_BAD'));
    log('chk4 F131 kept? ' + (out.indexOf('[F131]') > -1 ? 'YES_OK' : 'NO_BAD'));
    log('chk5 F132 kept? ' + (out.indexOf('__lcOtp =') > -1 ? 'YES_OK' : 'NO_BAD'));
    log('chk6 F130 kept? ' + (out.indexOf('kddF130') > -1 ? 'YES_OK' : 'NO_BAD'));
    log('2 put');
    return req('PUT','https://api.github.com/repos/'+REPO+'/contents/'+P, { message: 'fix: live card renders empty then fills realtime (F133)', content: b64e(out), sha: info.sha });
  }).then(function(){ log('DONE'); btn.disabled = false; })
    .catch(function(e){ log('ERR ' + (e && e.message)); btn.disabled = false; });
};
</script>
</body>
</html>
