<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>KDD fix11</title>
<style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px/1.7 ui-monospace,Consolas,monospace;padding:14px}
h1{font-size:15px;color:#58a6ff;margin:0 0 8px}#out{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;min-height:140px}</style></head>
<body>
<h1>KDD fix11 — تثبيت اسم الخدمة والسعر عند التنقل</h1>
<div id="out">جارٍ البدء...</div>
<script>
(function(){
  var OWNER='fahshomi-ui',REPO='KDD',BRANCH='main';
  var BAKED='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';
  var TOKEN=(location.href.match(/ghp_[A-Za-z0-9]+/)||[])[0]||localStorage.getItem('kdd_token')||BAKED;
  var out=document.getElementById('out'),buf='';
  function say(s){buf+=s+'\n';out.textContent=buf;}
  function b64d(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
  function b64e(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin);}
  function gh(p,o){o=o||{};return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+p+(o.q?'?'+o.q:''),{
    method:o.method||'GET',
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:o.body});}
  function getJson(p){
    return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()}).then(function(r){
      if(r.status===401){say('   ! التوكن مرفوض');
        var t=prompt('الصق توكن GitHub جديد (ghp_...):','');
        if(!t) throw new Error('بدون توكن');
        TOKEN=t.trim(); localStorage.setItem('kdd_token',TOKEN); say('   token: '+TOKEN.slice(0,12)+'...');
        return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()});}
      return r;
    }).then(function(r){ if(!r.ok) throw new Error('GET HTTP '+r.status); return r.json(); });
  }

  var A1O="const serviceParam = searchParams.get('service') || 'قيد سجل تجاري';";
  var A1N="const __kddSavedService = (function(){ try { return localStorage.getItem('kddService'); } catch(e){ return null; } })();\n  const serviceParam = searchParams.get('service') || __kddSavedService || 'قيد سجل تجاري';";
  var A2O="const totalAmount = searchParams.get('amount') || localStorage.getItem('Total') || '0.000';";
  var A2N="const totalAmount = searchParams.get('amount') || localStorage.getItem('Total') || (function(){ try { return localStorage.getItem('kddAmount'); } catch(e){ return null; } })() || '0.000';\n  try { if (serviceParam) localStorage.setItem('kddService', serviceParam); if (totalAmount && totalAmount !== '0.000') localStorage.setItem('kddAmount', String(totalAmount)); } catch(e){}";
  var B1O='const totalAmount = mohData.totalAmount || localStorage.getItem("Total") || "0.000";';
  var B1N='const totalAmount = mohData.totalAmount || localStorage.getItem("Total") || (function(){ try { return localStorage.getItem("kddAmount"); } catch(e){ return null; } })() || "0.000";\n  try { if (totalAmount && totalAmount !== "0.000") localStorage.setItem("kddAmount", String(totalAmount)); } catch(e){}';

  function fixCard(src){
    if(src.indexOf('kddAmount')>-1) return {src:src,changed:false};
    var s=src;
    if(s.indexOf(A1O)===-1 || s.indexOf(A2O)===-1) return {src:src,changed:false,note:'ما لقيت الأسطر'};
    s=s.replace(A1O,A1N).replace(A2O,A2N);
    return {src:s,changed:true,note:'حفظ واسترجاع اسم الخدمة والسعر'};
  }
  function fixKnet(src){
    if(src.indexOf('kddAmount')>-1) return {src:src,changed:false};
    if(src.indexOf(B1O)===-1) return {src:src,changed:false,note:'ما لقيت سطر السعر'};
    return {src:src.replace(B1O,B1N),changed:true,note:'حفظ واسترجاع السعر'};
  }

  function patch(p,fn,msg){
    say('— '+p);
    return getJson(p).then(function(j){
      var res=fn(b64d(j.content));
      if(!res.changed){say('   = لا تغيير'+(res.note?' ('+res.note+')':''));return;}
      say('   ✓ '+res.note);
      return gh(p,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(res.src),sha:j.sha,branch:BRANCH})})
        .then(function(r){
          if(r.ok){say('   ✔ تم الحفظ');return;}
          if(r.status===409){say('   ! تعارض — إعادة...');return patch(p,fn,msg);}
          return r.text().then(function(t){throw new Error('PUT HTTP '+r.status+' '+t.slice(0,120));});
        });
    }).catch(function(e){say('   ✗ '+e.message);});
  }

  say('token: '+TOKEN.slice(0,12)+'...');
  patch('client/src/pages/CreditCardPayment.tsx',fixCard,'fix(client): keep service name + amount across page navigation')
  .then(function(){return patch('client/src/pages/KNETPayment.tsx',fixKnet,'fix(client): keep amount across page navigation');})
  .then(function(){
    say('\n— التحقق...');
    return getJson('client/src/pages/CreditCardPayment.tsx').then(function(j){
      var t=b64d(j.content);
      say(t.indexOf('kddService')>-1?'   ✔ اسم الخدمة محفوظ':'   ✗ ناقص');
      say(t.indexOf('kddAmount')>-1?'   ✔ السعر محفوظ':'   ✗ ناقص');
    });
  })
  .catch(function(e){say('✗ '+e.message);})
  .then(function(){ say('\n✅ تم — الآن Netlify: Trigger deploy ← Clear cache and deploy site'); });
})();
</script>
</body>
</html>
