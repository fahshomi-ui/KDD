<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>fix51</title>
<style>body{font:12px monospace;background:#111;color:#eee;margin:0;padding:10px;direction:ltr}#o{white-space:pre-wrap;line-height:1.6}</style>
</head><body>
<pre id="o">جارٍ...</pre>
<script>
var o = document.getElementById('o'); o.textContent = '';
function W(s){ o.textContent += s + '\n'; }
W('A ok');
var T = (location.hash || '').replace(/^#/, '').trim() || (localStorage.getItem('kdd_token') || '').trim();
if (!T) T = (prompt('الصق التوكن') || '').trim();
W('token ' + (T ? T.slice(0, 8) : 'NONE'));
function d64(s){ var b = atob(s.replace(/\s/g,'')); var a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new TextDecoder().decode(a); }
function e64(s){ var b = new TextEncoder().encode(s), r = ''; for (var i=0;i<b.length;i++) r += String.fromCharCode(b[i]); return btoa(r); }
function api(u, op){ op = op || {}; op.headers = op.headers || {}; op.headers['Authorization'] = 'token ' + T; op.headers['Accept'] = 'application/vnd.github+json'; return fetch(u, op); }

var CSS = ['<style id="kdd-responsive3">','/*FIX51*/','@media (max-width:767px){',
'[class~="w-1/3"],[class~="w-2/3"]{width:100%!important;max-height:50vh!important;overflow-y:auto!important;border-radius:10px}',
'.container{max-width:100%!important;padding-left:8px!important;padding-right:8px!important}',
'[style*="100vh"]{display:flex!important;flex-direction:column!important;height:auto!important}',
'}','</style>'].join('\n');

var FILES = ['server/admin/index.html', 'kdd-public/admin.html'];
var i = 0;
function next(){
  if (!T || i >= FILES.length){ W('ZZZ end'); return; }
  var p = FILES[i]; i++;
  W('E ' + p);
  api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p + '?ref=main&_=' + Date.now())
  .then(function(r){ if (r.status === 401) return { u:1 }; if (!r.ok) throw new Error('GET ' + r.status); return r.json(); })
  .then(function(j){
    if (j.u){ var n = (prompt('توكن غير صالح — الصق جديد') || '').trim(); if (n){ T = n; localStorage.setItem('kdd_token', T); i--; } setTimeout(next, 200); return; }
    var c = d64(j.content);
    if (c.indexOf('kdd-responsive3') > -1){ W('F مُصلَّح مسبقاً'); setTimeout(next, 100); return; }
    var b = c.lastIndexOf('</body>');
    var c2 = c.slice(0, b) + CSS + '\n' + c.slice(b);
    return api('https://api.github.com/repos/fahshomi-ui/KDD/contents/' + p, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:'fix51: mobile column max-height', content: e64(c2), sha: j.sha, branch:'main' }) })
      .then(function(r){ if (!r.ok) throw new Error('PUT ' + r.status); W('H تم التعديل'); setTimeout(next, 150); });
  })
  .catch(function(e){ W('ERR ' + e.message); setTimeout(next, 150); });
}
next();
</script>
</body></html>
