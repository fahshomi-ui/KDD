<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>fix38</title>
<style>
 body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0e1116;color:#e8e8e8;margin:0;padding:10px;direction:ltr}
 #out{white-space:pre-wrap;font-size:11px;line-height:1.45}
 .warn{color:#ffd166}.bad{color:#ff6b6b}.ok{color:#39d98a}.dim{color:#8ab4f8}
</style>
</head>
<body>
<pre id="out">جارٍ الفحص...</pre>
<script>
document.getElementById('out').textContent = 'SCRIPT RUNS\n';

(function(){
  var out = document.getElementById('out');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function log(s, c){ out.innerHTML += (c ? '<span class="'+c+'">'+esc(s)+'</span>' : esc(s)) + '\n'; }

  var URL = 'https://raw.githubusercontent.com/fahshomi-ui/KDD/main/server/admin/index.html?cb=' + Date.now();

  function oddQ(L, q){
    var n = 0, bs = 0;
    for (var j = 0; j < L.length; j++){
      var ch = L[j];
      if (ch === '\\'){ bs++; continue; }
      if (bs % 2 === 1){ bs = 0; continue; }
      if (ch === q) n++;
      bs = 0;
    }
    return n % 2 === 1;
  }

  fetch(URL, { cache: 'no-store' })
    .then(function(r){ log('HTTP ' + r.status, 'dim'); return r.text(); })
    .then(function(t){
      out.textContent = '';
      var lines = t.split('\n');
      log('total lines: ' + lines.length, 'ok');
      log('has FIX37: ' + (t.indexOf('FIX37') > -1), 'warn');

      log('');
      log('===== أسطر فيها script tags =====', 'dim');
      for (var i = 0; i < lines.length; i++){
        if (lines[i].indexOf('<script') > -1 || lines[i].indexOf('<\/script>') > -1){
          log('L' + (i + 1) + ' : ' + lines[i].trim().slice(0, 140));
        }
      }

      log('');
      log('===== أسطر فيها تنصيص مفرد فردي =====', 'bad');
      var cnt = 0;
      for (var i = 0; i < lines.length; i++){
        if (lines[i].indexOf("'") < 0) continue;
        if (oddQ(lines[i], "'")){
          cnt++;
          log('');
          log('L' + (i + 1) + '  len=' + lines[i].length, 'bad');
          log(lines[i].slice(0, 300));
        }
      }
      if (!cnt) log('ولا سطر', 'ok');

      log('');
      log('===== أسطر فيها تنصيص مزدوج فردي =====', 'warn');
      var cnt2 = 0;
      for (var i = 0; i < lines.length; i++){
        if (lines[i].indexOf('"') < 0) continue;
        if (oddQ(lines[i], '"')){
          cnt2++;
          log('L' + (i + 1) + ' : ' + lines[i].trim().slice(0, 160));
        }
      }
      if (!cnt2) log('ولا سطر', 'ok');

      log('');
      log('===== تحليل السكربت كامل =====', 'dim');
      var a = -1, b = -1;
      for (var i = 0; i < lines.length; i++){
        if (a < 0 && lines[i].indexOf('<script') > -1) a = i;
        if (lines[i].indexOf('<\/script>') > -1) b = i;
      }
      log('script: ' + (a + 1) + ' -> ' + (b + 1));
      try { new Function(lines.slice(a + 1, b).join('\n')); log('PARSE OK', 'ok'); }
      catch(e){ log('PARSE FAIL: ' + e.message, 'bad'); }
    })
    .catch(function(e){ log('فشل: ' + e.message, 'bad'); });
})();
</script>
</body>
</html>
