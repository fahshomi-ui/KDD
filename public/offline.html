<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>غير متصل — كي دي دي</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fff5f5, #ffe5e5);
      color: #1a1a1a; padding: 20px; text-align: center;
    }
    .card {
      max-width: 420px; background: #fff; border-radius: 24px;
      padding: 40px 28px; box-shadow: 0 20px 60px -10px rgba(230, 33, 40, 0.25);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #E62128; }
    p { color: #666; line-height: 1.6; margin-bottom: 24px; font-size: 15px; }
    button {
      background: #E62128; color: white; border: 0; padding: 14px 28px;
      border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s; width: 100%;
    }
    button:hover { transform: translateY(-2px); }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-icon-192.png" class="logo" alt="كي دي دي" />
    <div class="icon">📶</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل حالياً. تحقق من اتصالك بالإنترنت ثم أعد المحاولة.</p>
    <button onclick="location.reload()">🔄 إعادة المحاولة</button>
  </div>
</body>
</html>
