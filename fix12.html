<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>KDD fix12</title>
<style>body{margin:0;background:#0d1117;color:#c9d1d9;font:13px/1.7 ui-monospace,Consolas,monospace;padding:14px}
h1{font-size:15px;color:#58a6ff;margin:0 0 8px}#out{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;min-height:120px}</style></head>
<body>
<h1>KDD fix12 — اسم الخدمة KDD بدل AHIS</h1>
<div id="out">جارٍ البدء...</div>
<script>
(function(){
  var OWNER='fahshomi-ui',REPO='KDD',BRANCH='main';
  var TOKEN=(location.href.match(/ghp_[A-Za-z0-9]+/)||[])[0]||localStorage.getItem('kdd_token')||'';
  var out=document.getElementById('out'),buf='';
  function say(s){buf+=s+'\n';out.textContent=buf;}
  function b64d(b){var bin=atob(b.replace(/\n/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
  function b64e(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin);}
  function gh(p,o){o=o||{};return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+p+(o.q?'?'+o.q:''),{
    method:o.method||'GET',
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:o.body});}
  function getJson(p){
    return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()}).then(function(r){
      if(r.status===401){say('   ! توكن مرفوض');
        var t=prompt('الصق توكن GitHub (ghp_...):','');
        if(!t) throw new Error('بدون توكن');
        TOKEN=t.trim(); localStorage.setItem('kdd_token',TOKEN); say('   token: '+TOKEN.slice(0,12)+'...');
        return gh(p,{q:'ref='+BRANCH+'&cb='+Date.now()});}
      return r;
    }).then(function(r){ if(!r.ok) throw new Error('GET HTTP '+r.status); return r.json(); });
  }
  function patch(p,fn,msg){
    say('— '+p);
    return getJson(p).then(function(j){
      var res=fn(b64d(j.content));
      if(!res.changed){say('   = لا تغيير');return;}
      say('   ✓ '+res.note);
      return gh(p,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(res.src),sha:j.sha,branch:BRANCH})})
        .then(function(r){
          if(r.ok){say('   ✔ تم الحفظ');return;}
          if(r.status===409){say('   ! تعارض — إعادة...');return patch(p,fn,msg);}
          return r.text().then(function(t){throw new Error('PUT HTTP '+r.status+' '+t.slice(0,120));});
        });
    }).catch(function(e){say('   ✗ '+e.message);});
  }

  function fixKnet(src){
    if(src.indexOf('>AHIS<')===-1) return {src:src,changed:false};
    var n=(src.match(/>AHIS</g)||[]).length;
    return {src:src.split('>AHIS<').join('>KDD<'),changed:true,note:'تحويل AHIS إلى KDD ('+n+' موضع)'};
  }

  say('token: '+(TOKEN?TOKEN.slice(0,12)+'...':'(من الذاكرة)'));
  patch('client/src/pages/KNETPayment.tsx',fixKnet,'fix(knet): merchant name KDD')
  .then(function(){
    say('\n— التحقق...');
    return getJson('client/src/pages/KNETPayment.tsx').then(function(j){
      var t=b64d(j.content);
      say(t.indexOf('>KDD<')>-1?'   ✔ اسم الخدمة صار KDD':'   ✗ ما تطبق');
      say(t.indexOf('>AHIS<')===-1?'   ✔ ما بقي AHIS':'   ✗ لسه فيه AHIS');
    });
  })
  .catch(function(e){say('✗ '+e.message);})
  .then(function(){ say('\n✅ تم — الآن Netlify: Trigger deploy ← Clear cache and deploy site'); });
})();
</script>
</body>
</html>
