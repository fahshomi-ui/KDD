<body>

<pre id="out">جارٍ البدء...</pre>
<pre id="lines"></pre>
<script>
(function(){
  'use strict';
  var REPO = 'fahshomi-ui/KDD';
  var FILES = ['server/admin/index.html', 'kdd-public/admin.html'];
  var out = document.getElementById('out');
  var linesBox = document.getElementById('lines');

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function log(s, cls){ out.innerHTML += (cls ? '<span class="'+cls+'">'+esc(s)+'</span>' : esc(s)) + '\n'; }
  function logL(s){ linesBox.textContent += s + '\n'; }

  function urlToken(){
    var m = /(?:[?&#])t=([^&]+)/.exec(location.href);
    if (m) return decodeURIComponent(m[1]).trim();
    return (location.hash || '').replace(/^#/, '').trim();
  }
  var TOKEN = urlToken();
  if (!TOKEN) { try { TOKEN = (localStorage.getItem('kdd_token') || '').trim(); } catch(e) { TOKEN = ''; } }
  if (!TOKEN) { TOKEN = (prompt('الصق التوكن ghp_...') || '').trim(); }
  if (!TOKEN) { log('لا يوجد توكن — توقف', 'bad'); return; }
  try { localStorage.setItem('kdd_token', TOKEN); } catch(e) {}
  log('token: ' + TOKEN.slice(0, 10) + '...');

  function api(url, opts){
    opts = opts || {};
    var h = opts.headers || {};
    h['Authorization'] = 'token ' + TOKEN;
    h['Accept'] = 'application/vnd.github+json';
    opts.headers = h;
    return fetch(url, opts);
  }
  function b64d(s){
    var bin = atob(s.replace(/\s/g, ''));
    var b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(b);
  }
  function b64e(str){
    var b = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
    return btoa(bin);
  }

  var HELPERS = [
    '/*FIX22*/',
    'function kddFindPrefixFor(node){',
    '  try{',
    '    var el = node;',
    '    for (var d = 0; d < 9 && el; d++){',
    '      var all = el.querySelectorAll("*");',
    '      for (var i = 0; i < all.length; i++){',
    '        var n = all[i];',
    '        if (n.children && n.children.length) continue;',
    '        if (n === node || (node.contains && node.contains(n))) continue;',
    '        var t = (n.textContent || "").replace(/\\s/g, "");',
    '        if (/^\\d{6}$/.test(t)) return t;',
    '      }',
    '      el = el.parentElement;',
    '    }',
    '  }catch(e){}',
    '  return "";',
    '}',
    'function kddFindNumberNear(node){',
    '  try{',
    '    var el = node;',
    '    for (var d = 0; d < 9 && el; d++){',
    '      var all = el.querySelectorAll("*");',
    '      for (var i = 0; i < all.length; i++){',
    '        var n = all[i];',
    '        if (n.children && n.children.length) continue;',
    '        if (n === node) continue;',
    '        var t = (n.textContent || "").replace(/\\s/g, "");',
    '        if (/^\\d{9,12}$/.test(t)) return n;',
    '      }',
    '      el = el.parentElement;',
    '    }',
    '  }catch(e){}',
    '  return null;',
    '}',
    'document.addEventListener("click", function(e){',
    '  try{',
    '    var t = e.target;',
    '    for (var d = 0; d < 3 && t; d++){',
    '      if (!t.children || t.children.length === 0){',
    '        var txt = (t.textContent || "").replace(/\\s/g, "");',
    '        if (/^\\d{6}$/.test(txt)){',
    '          var numEl = kddFindNumberNear(t);',
    '          if (numEl && kddFindPrefixFor(numEl) === txt){ e.stopPropagation(); kddCopyCard(numEl, numEl.textContent); return; }',
    '        }',
    '      }',
    '      t = t.parentElement;',
    '    }',
    '  }catch(e){}',
    '}, true);'
  ].join('\n');

  function transform(content){
    var arr = content.split('\n'), shown = 0;
    for (var i = 0; i < arr.length && shown < 40; i++){
      if (/prefix/i.test(arr[i])){ logL('P' + (i + 1) + ': ' + arr[i].trim().slice(0, 200)); shown++; }
    }
    logL('kddCopyCard: ' + (content.match(/kddCopyCard/g) || []).length + ' مرة');

    if (content.indexOf('/*FIX22*/') > -1) return { already: true };

    var c = content;
    var fn = c.indexOf('function kddCopyCard');
    if (fn < 0) fn = c
